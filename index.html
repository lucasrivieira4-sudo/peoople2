        function translateMetaError(errorText) {
            if (!errorText) return errorText;
            // Formato: [código] título — detalhe
            const codeMatch = errorText.match(/^\[(\d+)\]/);
            if (codeMatch) {
                const code = parseInt(codeMatch[1]);
                if (META_ERROR_CODES[code]) {
                    return `Erro ${code}: ${META_ERROR_CODES[code]}`;
                }
            }
            // Tenta traduzir pelo título
            for (const [en, pt] of Object.entries(META_ERROR_TITLES)) {
                if (errorText.toLowerCase().includes(en.toLowerCase())) {
                    const codePrefix = codeMatch ? `Erro ${codeMatch[1]}: ` : '';
                    return `${codePrefix}${pt}`;
                }
            }
            return errorText;
        }

        // Comprime imagem no browser antes de enviar (reduz 5-20x o tamanho)
        const processFile = (file) => new Promise(resolve => {
            const fileName = String(file.name || '').toLowerCase();
            const videoMime = file.type === 'video/mp4' || file.type === 'video/3gpp'
                ? file.type
                : (fileName.endsWith('.3gp') ? 'video/3gpp' : (fileName.endsWith('.mp4') ? 'video/mp4' : null));
            const isVideo = file.type.startsWith('video/') || /\.(mp4|3gp)$/i.test(fileName);
            if (isVideo) {
                if (!videoMime) {
                    alert('Formato de vídeo não compatível. Selecione um arquivo MP4 ou 3GP.');
                    resolve(null);
                    return;
                }
                if (file.size > 16 * 1024 * 1024) {
                    alert('O vídeo deve ter no máximo 16 MB.');
                    resolve(null);
                    return;
                }
                const reader = new FileReader();
                reader.onload = ev => resolve({ name: file.name, type: videoMime, data: ev.target.result });
                reader.onerror = () => {
                    alert('Não foi possível ler o arquivo de vídeo.');
                    resolve(null);
                };
                reader.readAsDataURL(file);
                return;
            }
            if (!file.type.startsWith('image/')) {
                // Não é imagem: só lê como base64 sem processar
                const r = new FileReader();
                r.onload = ev => resolve({ name: file.name, type: file.type, data: ev.target.result });
                r.readAsDataURL(file);
                return;
            }
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(url);
                const MAX = 1280;
                let { width, height } = img;
                if (width > MAX || height > MAX) {
                    if (width > height) { height = Math.round(height * MAX / width); width = MAX; }
                    else { width = Math.round(width * MAX / height); height = MAX; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                const data = canvas.toDataURL('image/jpeg', 0.82);
                resolve({ name: file.name.replace(/\.[^.]+$/, '.jpg'), type: 'image/jpeg', data });
            };
            img.onerror = () => {
                // Fallback: lê sem compressão
                const r = new FileReader();
                r.onload = ev => resolve({ name: file.name, type: file.type, data: ev.target.result });
                r.readAsDataURL(file);
            };
            img.src = url;
        });

        // ============================================

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);

            static getDerivedStateFromError(error) {
                return { hasError: true, error };

        const WHATSAPP_WINDOW_MS = 24 * 60 * 60 * 1000;

        const getConversationReplyStatus = (conversation, now = Date.now()) => {
            const lastReceivedAt = conversation?.lastReceived
                ? new Date(conversation.lastReceived).getTime()
                : NaN;
            if (!Number.isFinite(lastReceivedAt)) return 'other';

            const lastDirection = conversation.direction || conversation.lastDirection;
            if (lastDirection === 'received') {
                return now - lastReceivedAt < WHATSAPP_WINDOW_MS ? 'awaiting' : 'expired';
            }

            if (lastDirection === 'sent') {
                const lastMessageAt = conversation.timestamp
                    ? new Date(conversation.timestamp).getTime()
                    : NaN;
                if (Number.isFinite(lastMessageAt) && lastMessageAt >= lastReceivedAt) return 'answered';
            }

            return 'other';
        };

        const WindowTimer = memo(({ lastReceived }) => {
            const [t, setT] = useState(''); 
            const [exp, setExp] = useState(false);
            
            useEffect(() => {
                if (!lastReceived) return;
                const upd = () => {
                    const d = (new Date(lastReceived).getTime() + 86400000) - Date.now();
                    if (d <= 0) { setT('Expirada'); setExp(true); }
                    else { 
                        const hours = Math.floor(d/3600000);
                        const minutes = Math.floor((d%3600000)/60000);
                        setT(`${hours}h ${minutes}m`); 
                        setExp(false); 
                    }
                };
                upd(); 
                const i = setInterval(upd, 60000); 
                return () => clearInterval(i);
            }, [lastReceived]);
            
            if (!lastReceived) return null;
            return (
                <div className={`text-[10px] font-black px-2 py-0.5 rounded border ${exp ? 'bg-red-50 text-red-600 border-red-100' : 'bg-green-50 text-green-600 border-green-100'}`}>
                    {t}
                </div>
            );
        });

        const ChatView = memo(({ conversations, selectedPhone, setSelectedPhone, config, templates, quickReplies, socket, setConversations, unreadCounts, leads }) => {
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [isSending, setIsSending] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [showTpl, setShowTpl] = useState(false);
            const [showQr, setShowQr] = useState(false);
            const [file, setFile] = useState(null);
            const [error, setError] = useState(null);
            const [pendingTpl, setPendingTpl] = useState(null);
            const [replyTo, setReplyTo] = useState(null);
            const [hasMore, setHasMore] = useState(false);
            const [isLoadingMore, setIsLoadingMore] = useState(false);
            const [showSearch, setShowSearch] = useState(false);
            const [searchText, setSearchText] = useState('');
            const [conversationFilter, setConversationFilter] = useState('all');
            const [filterNow, setFilterNow] = useState(Date.now());
            const searchInputRef = useRef(null);
            const [mobileShowChat, setMobileShowChat] = useState(false);
            const [isSendingLocation, setIsSendingLocation] = useState(false);
            const [showEmoji, setShowEmoji] = useState(false);
            const emojiRef = useRef(null);
            const [forwardVideoMessage, setForwardVideoMessage] = useState(null);
            const [forwardSearch, setForwardSearch] = useState('');
            const [forwardingVideo, setForwardingVideo] = useState(false);

            const messageWamids = useMemo(() => new Set(
                (messages || [])
                    .filter(message => message.type !== 'reaction' && message.wamid)
                    .map(message => String(message.wamid))
            ), [messages]);

            const reactionsByWamid = useMemo(() => {
                const latestReactions = new Map();
                (messages || []).forEach(message => {
                    if (message.type !== 'reaction' || !message.reactionToWamid) return;
                    const targetWamid = String(message.reactionToWamid);
                    if (message.reactionEmoji) latestReactions.set(targetWamid, message.reactionEmoji);
                    else latestReactions.delete(targetWamid);
                });
                return latestReactions;
            }, [messages]);

            const visibleMessages = useMemo(() => (messages || []).filter(message =>
                message.type !== 'reaction'
                || !message.reactionToWamid
                || !messageWamids.has(String(message.reactionToWamid))
            ), [messages, messageWamids]);

            // Quando abre o chat no mobile, empurra um estado no histórico
            // para que o botão físico "voltar" feche o chat em vez de sair da página
            useEffect(() => {
                if (mobileShowChat) {
                    window.history.pushState({ mobileChatOpen: true }, '');
                }
            }, [mobileShowChat]);

            useEffect(() => {
                const onPopState = (e) => {
                    if (mobileShowChat) {
                        setMobileShowChat(false);
                    }
                };
                window.addEventListener('popstate', onPopState);
                return () => window.removeEventListener('popstate', onPopState);
            }, [mobileShowChat]);
            
            const endRef = useRef(null);
            const scrollRef = useRef(null);
            const inputRef = useRef(null);
            const isBottom = useRef(true);
            const fInput = useRef(null);
            const audio = useRef(null);

            useEffect(() => {
                if (typeof window !== 'undefined') {
                    audio.current = new Audio(NOTIFICATION_SOUND);
                    audio.current.volume = 0.5;
                }
            }, []);

            useEffect(() => {
                if (!showEmoji) return;
                const handler = (e) => {
                    if (emojiRef.current && !emojiRef.current.contains(e.target)) {
                        setShowEmoji(false);
                    }
                };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, [showEmoji]);

            const insertEmoji = useCallback((emoji) => {
                const input = inputRef.current;
                if (!input) { setInputText(prev => prev + emoji); return; }
                const start = input.selectionStart ?? inputText.length;
                const end = input.selectionEnd ?? inputText.length;
                const newText = inputText.substring(0, start) + emoji + inputText.substring(end);
                setInputText(newText);
                setTimeout(() => {
                    input.focus();
                    const pos = start + emoji.length;
                    input.setSelectionRange(pos, pos);
                }, 0);
            }, [inputText]);

            // Tenta achar nas conversas; se não achar, cria um contato mínimo com o próprio telefone
            const contact = useMemo(() => {
                if (!selectedPhone) return null;
                const found = (conversations || []).find(c => c.phone === selectedPhone);
                if (found) return found;
                // Lead adicionado manualmente que ainda não tem histórico de mensagens
                return { phone: selectedPhone, name: selectedPhone, lastMessage: '', tags: [] };
            }, [conversations, selectedPhone]);

            useEffect(() => {
                const timer = setInterval(() => setFilterNow(Date.now()), 60000);
                return () => clearInterval(timer);
            }, []);

            const conversationFilterCounts = useMemo(() => {
                const counts = { all: (conversations || []).length, awaiting: 0, expired: 0, answered: 0 };
                (conversations || []).forEach(c => {
                    const status = getConversationReplyStatus(c, filterNow);
                    if (status in counts && status !== 'all') counts[status] += 1;
                });
                return counts;
            }, [conversations, filterNow]);

            // Filtra conversas pelo status de resposta e pelo texto de busca
            const filteredConversations = useMemo(() => {
                const q = searchText.trim().toLowerCase();
                return (conversations || []).filter(c =>
                    (conversationFilter === 'all' || getConversationReplyStatus(c, filterNow) === conversationFilter) &&
                    (!q ||
                        (c.name || '').toLowerCase().includes(q) ||
                        (c.phone || '').includes(q) ||
                        (c.lastMessage || '').toLowerCase().includes(q))
                );
            }, [conversations, searchText, conversationFilter, filterNow]);

            const forwardContacts = useMemo(() => {
                const query = forwardSearch.trim().toLowerCase();
                const sourcePhone = String(forwardVideoMessage?.phone || '').replace(/\D/g, '');
                return (leads || [])
                    .filter(lead => {
                        if (!lead.phone || String(lead.phone).replace(/\D/g, '') === sourcePhone) return false;
                        return !query
                            || `${lead.name || ''} ${lead.phone || ''}`.toLowerCase().includes(query)
                            || String(lead.phone).replace(/\D/g, '').includes(query.replace(/\D/g, ''));
                    })
                    .slice(0, 30);
            }, [leads, forwardSearch, forwardVideoMessage]);
            const forwardDigits = forwardSearch.replace(/\D/g, '');
            const exactForwardContactExists = (leads || []).some(lead =>
                String(lead.phone || '').replace(/\D/g, '') === forwardDigits
                || String(lead.phone || '').replace(/\D/g, '').endsWith(forwardDigits)
            );

            // Foca no campo de busca ao abrir
            useEffect(() => {
                if (showSearch && searchInputRef.current) {
                    setTimeout(() => searchInputRef.current?.focus(), 50);
                }
            }, [showSearch]);

            useEffect(() => {
                if (!selectedPhone) return;
                
                let isMounted = true;
                setMessages([]); 
                setIsLoading(true);
                setHasMore(false);
                setError(null);
                setReplyTo(null);
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                fetch(`/api/messages/${encodeURIComponent(selectedPhone)}?limit=50`, {
                    signal: controller.signal
                })
                    .then(res => {
                        clearTimeout(timeoutId);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        if (!isMounted) return;
                        const msgs = Array.isArray(data) ? data : [];
                        setMessages(msgs);
                        setHasMore(msgs.length >= 50);
                        setIsLoading(false);
                        setTimeout(() => endRef.current?.scrollIntoView({ behavior: "auto" }), 100);

                        // Carrega mídia das mensagens em lotes — imediatamente para as últimas 5,
                        // e com delay de 12s para as demais (dá tempo do background download terminar)
                        const mediaMessages = msgs.filter(m => m.hasMedia);
                        if (mediaMessages.length > 0 && isMounted) {
                            const loadMedia = async (batch, delay) => {
                                if (delay) await new Promise(r => setTimeout(r, delay));
                                if (!isMounted) return;
                                for (const pm of batch) {
                                    try {
                                        const r = await fetch(`/api/messages/media/${pm._id}`);
                                        if (!r.ok) continue;
                                        const d = await r.json();
                                        if (d.mediaData && isMounted) {
                                            setMessages(prev => prev.map(m =>
                                                String(m._id) === String(pm._id) ? { ...m, mediaData: d.mediaData } : m
                                            ));
                                        }
                                    } catch (e) {}
                                }
                            };
                            // últimas 5 mensagens com mídia: carrega imediatamente (mais visíveis)
                            const recent = mediaMessages.slice(-5);
                            const older = mediaMessages.slice(0, -5);
                            loadMedia(recent, 0);
                            if (older.length > 0) loadMedia(older, 500);
                        }
                    })
                    .catch(err => {
                        clearTimeout(timeoutId);
                        if (!isMounted) return;
                        console.error('Erro carregando mensagens:', err);
                        setError(err.name === 'AbortError' ? 'Timeout ao carregar' : err.message);
                        setIsLoading(false);
                    });
                    
                return () => { 
                    isMounted = false; 
                    controller.abort();
                };
            }, [selectedPhone, socket]);

            // Entra na sala da conversa ao conectar e sempre que o socket reconectar.
            useEffect(() => {
                if (!socket || !selectedPhone) return;
                const joinSelectedChat = () => {
                    if (socket.connected) socket.emit('joinChat', selectedPhone);
                };
                joinSelectedChat();
                socket.on('connect', joinSelectedChat);
                return () => socket.off('connect', joinSelectedChat);
            }, [socket, selectedPhone]);

            useEffect(() => {
                if (!socket || !selectedPhone) return;
                
                const hNew = (msg) => {
                    if (msg.phone !== selectedPhone) return;
                    if (msg.direction === 'received' && audio.current) {
                        audio.current.play().catch(() => {});
                    }
                    setMessages(prev => {
                        if (prev.find(m => m.wamid === msg.wamid)) return prev;
                        return [...prev.filter(m => !(m.isOptimistic && m.text === msg.text)), msg];
                    });
                    if (isBottom.current) {
                        setTimeout(() => endRef.current?.scrollIntoView({ behavior: "smooth" }), 50);
                    }
                };
                
                const hStatus = (d) => {
                    setMessages(prev => prev.map(m => {
                        if (m.wamid !== d.wamid) return m;
                        const upd = { ...m, status: d.status };
                        if (d.error) upd.error = d.error;
                        return upd;
                    }));
                };

                // Atualiza a mídia quando o servidor terminar o download (sem travar a mensagem)
                const hMedia = (d) => {
                    setMessages(prev => prev.map(m => String(m._id) === String(d._id) ? { ...m, mediaData: d.mediaData } : m));
                };
                
                socket.on('newMessage', hNew); 
                socket.on('statusUpdate', hStatus);
                socket.on('mediaUpdate', hMedia);
                
                return () => { 
                    socket.off('newMessage', hNew); 
                    socket.off('statusUpdate', hStatus);
                    socket.off('mediaUpdate', hMedia);
                };
            }, [socket, selectedPhone]);

            const loadMoreMessages = useCallback(async () => {
                if (isLoadingMore || !hasMore || !selectedPhone || messages.length === 0) return;
                setIsLoadingMore(true);
                const oldest = messages[0];
                try {
                    const res = await fetch(`/api/messages/${encodeURIComponent(selectedPhone)}?limit=50&before=${encodeURIComponent(oldest.timestamp)}`);
                    if (!res.ok) throw new Error();
                    const older = await res.json();
                    if (older.length < 50) setHasMore(false);
                    if (older.length === 0) { setIsLoadingMore(false); return; }
                    const scrollEl = scrollRef.current;
                    const prevHeight = scrollEl?.scrollHeight || 0;
                    setMessages(prev => [...older, ...prev]);
                    requestAnimationFrame(() => {
                        if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight - prevHeight;
                    });
                    const mediaOlder = older.filter(m => m.hasMedia);
                    if (mediaOlder.length > 0) {
                        for (const pm of mediaOlder) {
                            try {
                                const r = await fetch(`/api/messages/media/${pm._id}`);
                                if (!r.ok) continue;
                                const d = await r.json();
                                if (d.mediaData) setMessages(prev => prev.map(m => String(m._id) === String(pm._id) ? { ...m, mediaData: d.mediaData } : m));
                            } catch {}
                        }
                    }
                } catch {}
                setIsLoadingMore(false);
            }, [isLoadingMore, hasMore, selectedPhone, messages]);

            const handleScroll = useCallback((e) => {
                const el = e.target;
                isBottom.current = el.scrollHeight - el.scrollTop - el.clientHeight < 50;
                if (el.scrollTop < 80 && hasMore && !isLoadingMore) {
                    loadMoreMessages();
                }
            }, [hasMore, isLoadingMore, loadMoreMessages]);

            const send = async (tpl = null, qr = null) => {
                if (isSending || (!inputText && !file && !tpl && !qr)) return;
                
                if (tpl?.components?.some(c => c.type === 'HEADER' && c.format === 'IMAGE') && !file) { 
                    setPendingTpl(tpl);
                    setShowTpl(false); 
                    fInput.current?.click(); 
                    return; 
                }
                
                setIsSending(true);
                const txt = qr ? qr.text : (tpl ? (tpl.components?.find(c=>c.type==='BODY')?.text || `Template: ${tpl.name}`) : inputText);
                const optId = 'opt-' + Date.now();
                
                const optimisticMsg = { 
                    _id: optId, 
                    phone: selectedPhone, 
                    text: txt || (file?.type?.startsWith('video/') ? '[VIDEO]' : ''),
                    direction: 'sent', 
                    type: file?.type?.startsWith('video/') ? 'video' : 'text',
                    mediaData: file?.type?.startsWith('video/') ? file.data : null,
                    timestamp: new Date().toISOString(), 
                    status: 'pending', 
                    isOptimistic: true 
                };
                
                const currentReplyTo = replyTo;
                setMessages(prev => [...prev, optimisticMsg]);
                setInputText('');
                setFile(null);
                setShowTpl(false);
                setShowQr(false);
                setReplyTo(null);
                
                requestAnimationFrame(() => {
                    endRef.current?.scrollIntoView({ behavior: "smooth" });
                });

                fetch('/api/messages/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        phone: selectedPhone, 
                        messageText: qr ? qr.text : (tpl ? (tpl.components?.find(c=>c.type==='BODY')?.text || tpl.name) : txt), 
                        templateName: tpl?.name,
                        languageCode: tpl?.language || undefined,
                        mediaData: qr?.mediaData || file?.data,
                        mediaType: qr?.mediaType || file?.type,
                        fileName: qr?.mediaName || file?.name,
                        replyToWamid: currentReplyTo?.wamid || undefined
                    })
                })
                .then(async (res) => {
                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        throw new Error(errData.error || `HTTP ${res.status}`);
                    }
                })
                .catch((err) => {
                    console.error('Erro envio:', err);
                    setMessages(prev => prev.map(m => 
                        m._id === optId ? { ...m, status: 'failed', error: err.message } : m
                    ));
                })
                .finally(() => {
                    setIsSending(false);
                    setTimeout(() => inputRef.current?.focus(), 150);
                });
            };

            const forwardVideo = async (phone) => {
                if (!forwardVideoMessage || forwardingVideo || !phone) return;
                setForwardingVideo(true);
                try {
                    const response = await fetch('/api/messages/forward-video', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messageId: forwardVideoMessage._id, phone })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
                    setForwardVideoMessage(null);
                    setForwardSearch('');
                } catch (error) {
                    alert(`Não foi possível encaminhar o vídeo: ${error.message}`);
                } finally {
                    setForwardingVideo(false);
                }
            };

            const sendLocation = useCallback(() => {
                if (isSendingLocation || !selectedPhone) return;
                if (!navigator.geolocation) {
                    alert('Seu navegador não suporta geolocalização.');
                    return;
                }
                setIsSendingLocation(true);
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const { latitude: lat, longitude: lng } = pos.coords;
                        const optId = 'opt-loc-' + Date.now();
                        const optimisticMsg = {
                            _id: optId,
                            phone: selectedPhone,
                            text: '📍 Localização compartilhada',
                            direction: 'sent',
                            type: 'location',
                            timestamp: new Date().toISOString(),
                            status: 'pending',
                            isOptimistic: true,
                            locationData: { lat, lng, name: null, address: null }
                        };
                        setMessages(prev => [...prev, optimisticMsg]);
                        requestAnimationFrame(() => endRef.current?.scrollIntoView({ behavior: 'smooth' }));
                        try {
                            const res = await fetch('/api/messages/send', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ phone: selectedPhone, lat, lng })
                            });
                            if (!res.ok) {
                                const err = await res.json().catch(() => ({}));
                                throw new Error(err.error || `HTTP ${res.status}`);
                            }
                        } catch (err) {
                            setMessages(prev => prev.map(m =>
                                m._id === optId ? { ...m, status: 'failed', error: err.message } : m
                            ));
                        } finally {
                            setIsSendingLocation(false);
                        }
                    },
                    (err) => {
                        setIsSendingLocation(false);
                        const msgs = {
                            1: 'Permissão de localização negada. Permita o acesso nas configurações do navegador.',
                            2: 'Não foi possível obter a localização.',
                            3: 'Tempo esgotado ao obter localização.'
                        };
                        alert(msgs[err.code] || 'Erro ao obter localização.');
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }, [isSendingLocation, selectedPhone]);

            useEffect(() => {
                if (file && pendingTpl) {
                    const tpl = pendingTpl;
                    setPendingTpl(null);
                    send(tpl);
                }
            }, [file, pendingTpl]);

            if (error) {
                return (
                    <div className="flex h-full w-full items-center justify-center">
                        <div className="text-center p-8 bg-red-50 rounded-2xl border border-red-200 max-w-md">
                            <i className="fas fa-exclamation-circle text-4xl text-red-500 mb-4"></i>
                            <p className="text-red-600 font-medium mb-4">{error}</p>
                            <button 
                                onClick={() => window.location.reload()}
                                className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700"
                            >
                                Tentar Novamente
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-full w-full">
                    <div className={`sidebar ${mobileShowChat ? 'mobile-hidden' : ''}`}>
                        <div className="p-4 border-b flex justify-between items-center gap-2">
                            {showSearch ? (
                                <div className="flex-1 flex items-center gap-2">
                                    <input
                                        ref={searchInputRef}
                                        value={searchText}
                                        onChange={e => setSearchText(e.target.value)}
                                        placeholder="Buscar por nome ou mensagem..."
                                        className="flex-1 px-4 py-2 bg-slate-100 rounded-full text-sm outline-none focus:ring-2 focus:ring-purple-400"
                                        onKeyDown={e => { if (e.key === 'Escape') { setShowSearch(false); setSearchText(''); } }}
                                    />
                                    <button
                                        onClick={() => { setShowSearch(false); setSearchText(''); }}
                                        className="w-8 h-8 rounded-full bg-slate-100 hover:bg-red-100 flex items-center justify-center text-slate-500 hover:text-red-500 shrink-0"
                                        title="Fechar busca"
                                    >
                                        <i className="fas fa-times text-sm"></i>
                                    </button>
                                </div>
                            ) : (
                                <>
                                    <div className="peoople-logo">PeOople</div>
                                    <button
                                        onClick={() => setShowSearch(true)}
                                        className="w-8 h-8 rounded-full bg-slate-100 hover:bg-purple-100 flex items-center justify-center text-slate-500 hover:text-purple-700 transition-colors"
                                        title="Buscar cliente"
                                    >
                                        <i className="fas fa-search text-sm"></i>
                                    </button>
                                </>
                            )}
                        </div>
                        <div className="grid grid-cols-2 gap-2 p-3 border-b bg-white">
                            {[
                                { id: 'all', label: 'Todas', title: 'Todas as conversas' },
                                { id: 'awaiting', label: 'Aguardando resposta', title: 'Última mensagem do cliente há menos de 24 horas' },
                                { id: 'expired', label: 'Janela expirada', title: 'Última mensagem do cliente há mais de 24 horas' },
                                { id: 'answered', label: 'Respondidas', title: 'A empresa respondeu depois da última mensagem do cliente' }
                            ].map(option => {
                                const active = conversationFilter === option.id;
                                return (
                                    <button
                                        key={option.id}
                                        type="button"
                                        title={option.title}
                                        aria-pressed={active}
                                        onClick={() => setConversationFilter(option.id)}
                                        className={`min-w-0 flex items-center justify-between gap-2 rounded-xl border px-3 py-2 text-[11px] font-bold transition-colors ${active ? 'bg-purple-700 text-white border-purple-700' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-purple-50 hover:text-purple-700'}`}
                                    >
                                        <span className="truncate">{option.label}</span>
                                        <span className={`shrink-0 rounded-full px-1.5 py-0.5 text-[10px] ${active ? 'bg-white/20 text-white' : 'bg-white text-slate-500'}`}>
                                            {conversationFilterCounts[option.id]}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                        <div className="overflow-y-auto flex-1">
                            {filteredConversations.length === 0 ? (
                                <div className="p-8 text-center text-slate-400">
                                    <i className="fas fa-comments text-3xl mb-2"></i>
                                    <p>{searchText ? 'Nenhum resultado' : conversationFilter !== 'all' ? 'Nenhuma conversa neste filtro' : 'Nenhuma conversa'}</p>
                                </div>
                            ) : (
                                filteredConversations.map(c => (
                                    <div 
                                        key={c.phone} 
                                        onClick={() => { setSelectedPhone(c.phone); setMobileShowChat(true); }} 
                                        className={`flex items-center p-4 cursor-pointer hover:bg-slate-50 border-b ${selectedPhone === c.phone ? 'bg-purple-50 border-r-4 border-r-purple-700' : (unreadCounts?.[c.phone] > 0 ? 'bg-purple-50/40' : '')}`}
                                    >
                                        <div className="relative mr-3 shrink-0">
                                            <div className="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center text-purple-700 font-bold">
                                                {(c.name || c.phone || '?')[0].toUpperCase()}
                                            </div>
                                            {(unreadCounts?.[c.phone] || 0) > 0 && (
                                                <span className="absolute -top-1 -right-1 bg-purple-700 text-white text-[10px] font-black rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1 shadow">
                                                    {unreadCounts[c.phone] > 99 ? '99+' : unreadCounts[c.phone]}
                                                </span>
                                            )}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className={`truncate ${(unreadCounts?.[c.phone] || 0) > 0 ? 'font-black text-slate-900' : 'font-bold text-slate-800'}`}>{c.name || c.phone}</span>
                                                <WindowTimer lastReceived={c.lastReceived} />
                                            </div>
                                            <div className={`text-sm truncate ${(unreadCounts?.[c.phone] || 0) > 0 ? 'font-semibold text-slate-700' : 'text-slate-500'}`}>{c.lastMessage || 'Sem mensagens'}</div>
                                            <div className="mt-2 flex flex-wrap gap-1">
                                                {(c.tags || []).map(t => (
                                                    <span 
                                                        key={t} 
                                                        className="tag-badge" 
                                                        style={{ backgroundColor: config?.tagColors?.[t] || '#e2e8f0' }}
                                                    >
                                                        {t}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                    <div className={`chat-area ${!mobileShowChat ? 'mobile-hidden' : ''}`}>
                        {selectedPhone ? (
                            contact ? (
                                <>
                                    <div className="p-4 bg-white border-b flex items-center justify-between shadow-sm z-10">
                                        <div className="flex items-center">
                                            <button

                                        <div ref={endRef} />

                                    <div className="chat-composer p-4 bg-white border-t">
                                        {replyTo && (

                                                        <i className="fas fa-reply mr-1"></i>

                                                    <i className="fas fa-times text-xs"></i>
                                                </button>
                                            </div>
                                        )}
                                        {file && (
                                            <div className="mb-3 p-3 bg-purple-50 rounded-xl border flex items-center">

                                                    {file.type?.includes('image') ?

                                                        file.type?.startsWith('video/') ?

                                                            <i className="fas fa-file text-purple-600"></i>
                                                    }
                                                </div>

                                                <button onClick={() => setFile(null)} className="p-2 text-red-400">
                                                    <i className="fas fa-times-circle"></i>

                                                data-lpignore="true"
                                                data-1p-ignore="true"

                                            <button 
                                                onClick={() => send()}

                                            >
                                                <i className={`fas ${isSending ? 'fa-circle-notch animate-spin' : 'fa-paper-plane'}`}></i>
                                            </button>

                                        {showQr && (quickReplies || []).length > 0 && (
                                            <div className="mt-3 p-2 bg-slate-50 rounded-xl border grid grid-cols-2 gap-2 max-h-40 overflow-y-auto">
                                                {(quickReplies || []).map(q => (
                                                    <button 
                                                        key={q._id} 
                                                        onClick={() => send(null, q)}

                                                        <div className="font-bold text-xs text-purple-600">/{q.shortcut}</div>
                                                        <div className="text-[10px] text-slate-500 truncate">{q.text}</div>

                                                        <div className="font-bold text-xs truncate">{t.name}</div>
                                                        <div className="text-[10px] text-slate-500 truncate">
                                                            {t.components?.find(c=>c.type==='BODY')?.text?.substring(0, 30) || ''}

                                </>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center text-slate-400 bg-slate-50">

                                <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm">
                                    <i className="fas fa-comments text-3xl text-purple-200"></i>
                                </div>
                                <div className="text-lg font-medium">Selecione uma conversa</div>
                            </div>

                    </div>
                    {forwardVideoMessage && (

                                        <h2 className="text-lg font-black text-slate-800">Encaminhar vídeo</h2>

                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => setForwardVideoMessage(null)}

                                        <i className="fas fa-times"></i>
                                    </button>

                                <div className="max-h-72 space-y-2 overflow-y-auto">
                                    {forwardContacts.map(lead => (
                                        <button
                                            key={lead.phone}

                                            type="button"
                                            disabled={forwardingVideo}
                                            onClick={() => forwardVideo(forwardSearch)}

                                </div>
                                <button
                                    type="button"
                                    onClick={() => setForwardVideoMessage(null)}

        });

        const CRM_PREVIEW = new URLSearchParams(window.location.search).get('preview') === '1';

        // A mesma tag e os mesmos contatos: apenas a lista de organização muda.
        const TagGroups = ({ tags, config, leads = [], onMoveTag, onSelect, onAdvertise, selected = [], initialScope = 'active', onScopeChange, disabled = false }) => {
            const [scope, setScope] = useState(initialScope);
            const [query, setQuery] = useState('');
            const [moving, setMoving] = useState(null);
            const [error, setError] = useState('');
            const workedTags = config?.workedTags || [];
            const visible = tags.filter(tag => workedTags.includes(tag) === (scope === 'worked')
                && tag.toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR')));
            const move = async (tag) => {
                const worked = scope !== 'worked';
                if (!confirm(`Mover a tag inteira "${tag}" para ${worked ? '“Já trabalhados”' : '“Ativas”'}?\n\nO nome, a cor e todos os contatos serão mantidos. Nenhuma mensagem será enviada.`)) return;
                setMoving(tag);
                setError('');
                try { await onMoveTag(tag, worked); }
                catch (err) { setError(err.message || 'Não foi possível mover a tag.'); }
                finally { setMoving(null); }
            };
            return (
                <div className="mb-4">
                    <div className="mb-3 flex flex-wrap gap-2" role="tablist" aria-label="Organização das tags">
                        {[['active', 'Ativas'], ['worked', 'Já trabalhados']].map(([key, label]) => (
                            <button key={key} type="button" role="tab" aria-selected={scope === key} disabled={disabled || !!moving}
                                onClick={() => { setScope(key); setError(''); if (onScopeChange) onScopeChange(key); }}
                                className={`rounded-xl border px-4 py-2 text-xs font-bold disabled:opacity-50 ${scope === key ? 'border-purple-700 bg-purple-700 text-white' : 'border-slate-200 bg-white text-slate-600'}`}>
                                {label} ({tags.filter(tag => workedTags.includes(tag) === (key === 'worked')).length})
                            </button>
                        ))}
                    </div>
                    <label className="mb-3 block text-xs font-bold text-slate-600">
                        Buscar tag
                        <input type="search" value={query} onChange={event => setQuery(event.target.value)}
                            placeholder="Digite o nome da tag"
                            className="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-normal outline-none focus:ring-2 focus:ring-purple-500" />
                    </label>
                    <p className="mb-3 text-xs text-slate-500">Mover organiza a tag inteira, sem duplicar, renomear ou retirar contatos. Não faz disparos.</p>
                    {error && <p role="alert" className="mb-3 rounded-xl bg-red-50 p-3 text-xs text-red-700">{error}</p>}
                    <div className="grid max-h-64 gap-2 overflow-y-auto overscroll-contain pr-2 sm:grid-cols-2" role="region" aria-label="Lista de tags" tabIndex={0}>
                        {visible.map(tag => (
                            <div key={tag} className="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-200 bg-white p-3">
                                <button type="button" disabled={disabled || !!moving} onClick={() => onSelect && onSelect(tag)}
                                    aria-pressed={selected.includes(tag)} className={`min-w-0 text-left ${selected.includes(tag) ? 'ring-2 ring-purple-400 rounded-lg' : ''}`}>
                                    <span className="inline-block break-all rounded-full px-3 py-1 text-xs font-bold text-white" style={{ backgroundColor: config?.tagColors?.[tag] || '#6b21a8' }}>{tag}</span>
                                    <span className="mt-1 block text-[10px] text-slate-500">{leads.filter(lead => (lead.tags || []).includes(tag)).length} contatos</span>
                                </button>
                                <div className="flex flex-wrap gap-2">
                                    {onAdvertise && <button type="button" onClick={() => onAdvertise(tag)} disabled={disabled || !!moving}
                                        aria-label={`Enviar publicidade: ${tag}`}
                                        className="rounded-lg bg-purple-700 px-3 py-2 text-[10px] font-bold text-white hover:bg-purple-800 disabled:opacity-50">
                                        Enviar publicidade
                                    </button>}
                                    <button type="button" onClick={() => move(tag)} disabled={disabled || !!moving}
                                        className="rounded-lg border border-purple-200 bg-purple-50 px-3 py-2 text-[10px] font-bold text-purple-800 hover:bg-purple-100 disabled:opacity-50">
                                        {moving === tag ? 'Movendo...' : scope === 'worked' ? 'Voltar para Ativas' : 'Mover para Já trabalhados'}
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                    {visible.length === 0 && <p className="rounded-xl bg-slate-50 p-4 text-center text-xs text-slate-500">Nenhuma tag nesta lista.</p>}
                </div>
            );
        };

        const deliveryLabels = { failed: 'Falha confirmada', accepted: 'Aceita, sem confirmação de entrega', uncertain: 'Resultado incerto', pending: 'Não tentado', delivered: 'Entregue', read: 'Lida' };
        const deliveryGuidance = (error) => {
            const code = String(error || '').match(/\[(\d+)\]/)?.[1];
            return ({
                '130472': 'A Meta não entregou porque este número participa de um experimento da plataforma. Não indica erro no telefone nem bloqueio pelo cliente. Evite repetir o disparo para tentar contornar a restrição.',
                '131026': 'A Meta não conseguiu entregar. Esse retorno não confirma bloqueio; confira se o número está correto e ativo no WhatsApp.',
                '131049': 'A Meta limitou esta mensagem de marketing para preservar o engajamento. Não repita imediatamente; revise frequência e interesse do contato.',
                '131048': 'Restrição por qualidade/spam. Revise consentimento, frequência e qualidade antes de tentar novamente.',
                '131047': 'Janela de atendimento encerrada. Fora da janela, use um template aprovado.',
                '131042': 'Verifique a forma de pagamento e a conta do WhatsApp Business.',
                '132000': 'A quantidade de variáveis não corresponde ao template. Revise o preenchimento.',
                '132001': 'Confira se o template existe, está aprovado e usa o idioma correto.',
                '132015': 'Template pausado pela Meta. Verifique a qualidade no Gerenciador do WhatsApp.',
                '132016': 'Template desativado pela Meta. Escolha outro template aprovado.',
                '130429': 'Limite de envios atingido. Aguarde e revise o ritmo dos disparos.',
                '190': 'Verifique a validade do token de acesso na configuração da integração.'
            })[code] || 'Confira o retorno original abaixo e a conta no Gerenciador do WhatsApp. Não é possível deduzir bloqueio ou desinteresse apenas por uma falha.';
        };
        const downloadDeliveryCsv = (rows, filter) => {
            const cell = value => {
                let text = String(value ?? '');
                if (/^[\s]*[=+\-@\t\r]/.test(text)) text = "'" + text;
                return '"' + text.replace(/"/g, '""') + '"';
            };
            const lines = [['Nome', 'Telefone', 'Situação', 'Motivo informado', 'Orientação'], ...rows.map(row => [row.name, row.phone, deliveryLabels[row.deliveryStatus], row.deliveryError || '', row.deliveryStatus === 'failed' ? deliveryGuidance(row.deliveryError) : ['delivered', 'read'].includes(row.deliveryStatus) ? 'Recebimento confirmado pela Meta.' : row.deliveryStatus === 'pending' ? 'Nenhuma tentativa registrada nesta lista.' : 'Sem confirmação de entrega. Confira antes de repetir.'])];
            const url = URL.createObjectURL(new Blob(['\uFEFF' + lines.map(line => line.map(cell).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8;' }));
            const link = document.createElement('a'); link.href = url; link.download = `contatos-${filter}.csv`; document.body.appendChild(link); link.click(); link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
        const DeliveryReport = ({ campaign, progress, leads, onSummary, sharedDeliveries = {}, onDeliveries }) => {
            const [filter, setFilter] = useState('failed');
            const [page, setPage] = useState(1);
            const [report, setReport] = useState({ recipients: [], total: 0 });
            const [deliveries, setDeliveries] = useState({});
            const [loading, setLoading] = useState(false);
            const [exporting, setExporting] = useState(false);
            const [error, setError] = useState('');
            const [updatedAt, setUpdatedAt] = useState('');
            const version = useRef(0);
            const currentProgress = useRef(progress);
            currentProgress.current = progress;
            const campaignId = campaign?._id;
            const fetchCampaignPage = async (requestedPage) => {
                const response = await fetch(`/api/remarketing/campaigns/${encodeURIComponent(campaignId)}/delivery-report?filter=${filter}&page=${requestedPage}`);
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !Array.isArray(data.recipients)) throw new Error([404, 405].includes(response.status) ? 'Atualize o backend no Railway para consultar as entregas desta campanha.' : data.error || 'Não foi possível consultar as entregas.');
                return data;
            };
            const refresh = async () => {
                const request = ++version.current;
                setLoading(true); setError('');
                try {
                    if (campaignId) {
                        const data = await fetchCampaignPage(page);
                        if (request === version.current) {
                            setReport(data);
                            const found = {};
                            data.recipients.forEach(row => {
                                const id = row.wamid || (String(currentProgress.current?.campaignId) === String(campaignId)
                                    ? currentProgress.current.results?.find(result => result.phone === row.phone)?.wamid : null);
                                const snapshot = { status: row.deliveryStatus === 'accepted' ? 'sent' : row.deliveryStatus, error: row.deliveryError };
                                if (id) found[id] = snapshot;
                                else found[`${campaignId}:${row.phone}`] = snapshot;
                            });
                            if (onDeliveries) onDeliveries(found);
                            if (data.summary && onSummary) onSummary(campaignId, data.summary);
                        }
                    } else {
                        const ids = [...new Set((currentProgress.current?.results || []).map(row => row.wamid).filter(Boolean))];
                        const found = {};
                        for (let i = 0; i < ids.length; i += 200) {
                            const response = await fetch('/api/messages/delivery-report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ wamids: ids.slice(i, i + 200) }) });
                            const data = await response.json().catch(() => ({}));
                            if (!response.ok || !Array.isArray(data.messages)) throw new Error('Atualize o backend no Railway para consultar os retornos de entrega da Meta. As tentativas locais continuam abaixo.');
                            data.messages.forEach(message => { found[message.wamid] = message; });
                        }
                        if (request === version.current) {
                            setDeliveries(current => mergeDeliverySnapshots(current, found));
                            if (onDeliveries) onDeliveries(found);
                        }
                    }
                    if (request === version.current) setUpdatedAt(new Date().toLocaleTimeString('pt-BR'));
                } catch (err) { if (request === version.current) setError(err.message); }
                finally { if (request === version.current) setLoading(false); }
            };
            useEffect(() => {
                setReport({ recipients: [], total: 0 }); setUpdatedAt('');
                if (!CRM_PREVIEW) refresh();
                const timer = !CRM_PREVIEW ? setInterval(refresh, 15000) : null;
                return () => { version.current++; if (timer) clearInterval(timer); };
            }, [campaignId, filter, page]);
            useEffect(() => { if (!campaignId && progress && !progress.running && !CRM_PREVIEW) refresh(); }, [progress?.running]);
            const syncedDeliveries = mergeDeliverySnapshots(deliveries, sharedDeliveries);
            const directRows = (progress?.results || []).map(row => {
                const message = syncedDeliveries[row.wamid];
                return { phone: row.phone, name: leads.find(lead => lead.phone === row.phone)?.name || '', deliveryStatus: ['failed', 'delivered', 'read'].includes(message?.status) ? message.status : row.status === 'sent' ? 'accepted' : row.status, deliveryError: message?.error || (row.status === 'failed' || row.status === 'uncertain' ? row.detail : '') };
            });
            const attempted = new Set(directRows.map(row => row.phone));
            (progress?.phones || []).filter(phone => !attempted.has(phone)).forEach(phone => directRows.push({ phone, name: leads.find(lead => lead.phone === phone)?.name || '', deliveryStatus: 'pending', deliveryError: '' }));
            const matchingRows = directRows.filter(row => filter === 'all' || (filter === 'unconfirmed' ? ['accepted', 'uncertain'].includes(row.deliveryStatus) : filter === 'delivered' ? ['delivered', 'read'].includes(row.deliveryStatus) : row.deliveryStatus === filter));
            const rows = campaignId ? report.recipients : matchingRows.slice((page - 1) * 200, page * 200);
            const total = campaignId ? report.total : matchingRows.length;
            const summary = campaignId ? report.summary : directRows.reduce((counts, row) => {
                counts[row.deliveryStatus] = (counts[row.deliveryStatus] || 0) + 1;
                return counts;
            }, {});
            const confirmed = (summary?.delivered || 0) + (summary?.read || 0);
            const failures = summary?.failed || 0;
            const unconfirmed = (summary?.accepted || 0) + (summary?.uncertain || 0);
            const exportRows = async () => {
                setExporting(true); setError('');
                try {
                    let all = matchingRows;
                    if (campaignId) {
                        all = []; let next = 1; let data;
                        do { data = await fetchCampaignPage(next++); all.push(...data.recipients); } while (all.length < data.total && data.recipients.length);
                    }
                    if (!all.length) throw new Error('Nenhum contato neste filtro para baixar.');
                    downloadDeliveryCsv(all, filter);
                } catch (err) { setError(err.message); }
                finally { setExporting(false); }
            };
            return (
                <section aria-label="Contatos por entrega da oferta" className="mb-5 rounded-2xl border border-red-200 bg-white p-4">
                    <h3 className="font-black text-purple-800">Quem ainda não recebeu a oferta?</h3>
                    <p className="mt-2 text-xs text-slate-600">{campaignId ? `Campanha: ${campaign.name}. Histórico consultado pelos retornos da Meta.` : 'Último disparo direto: esta lista só fica disponível enquanto esta tela estiver aberta.'} Falha confirmada é diferente de entrega ainda não confirmada. A Meta não informa se o cliente bloqueou sua empresa.</p>
                    <div aria-label="Resumo de entregas confirmadas" className="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-4">
                        {[
                            ['Entregues / lidas', summary ? confirmed : '—', 'bg-emerald-50 text-emerald-800'],
                            ['Falhas confirmadas', summary ? failures : '—', 'bg-red-50 text-red-800'],
                            ['Sem confirmação', summary ? unconfirmed : '—', 'bg-amber-50 text-amber-800'],
                            ['Não tentados', summary ? summary.pending || 0 : '—', 'bg-slate-100 text-slate-700']
                        ].map(([label, count, color]) => <div key={label} className={`rounded-xl p-3 ${color}`}><div className="text-xs font-bold">{label}</div><strong className="text-xl">{count}</strong></div>)}
                    </div>
                    {summary && <p role="status" className="mt-3 rounded-xl bg-amber-50 p-3 text-xs font-bold text-amber-900">{failures > 0 ? `${failures} falha(s) confirmada(s) pela Meta. Consulte os motivos abaixo.` : 'Nenhuma falha confirmada no histórico consultado.'} {unconfirmed > 0 ? `${unconfirmed} mensagem(ns) ainda sem confirmação: não conte como entregue.` : ''} Os totais acima incluem todos os filtros, não apenas a página atual.</p>}
                    <div className="mt-3 flex flex-wrap items-end gap-3">
                        <label className="text-xs font-bold text-slate-700">Separar contatos
                            <select value={filter} disabled={exporting} onChange={event => { setFilter(event.target.value); setPage(1); }} className="mt-1 block rounded-xl border border-slate-300 bg-white p-2 text-sm">
                                <option value="failed">Falhas confirmadas</option><option value="unconfirmed">Sem confirmação / incertos</option><option value="pending">Não tentados</option><option value="delivered">Entregues / lidas</option><option value="all">Todos os contatos</option>
                            </select>
                        </label>
                        <button type="button" disabled={loading || exporting || CRM_PREVIEW} onClick={refresh} className="rounded-xl border border-purple-200 px-3 py-2 text-xs font-bold text-purple-700 disabled:opacity-50">{loading ? 'Consultando…' : 'Atualizar entregas'}</button>
                        <button type="button" disabled={loading || exporting || !total || CRM_PREVIEW} onClick={exportRows} className="rounded-xl bg-purple-700 px-3 py-2 text-xs font-bold text-white disabled:opacity-50">{exporting ? 'Baixando…' : 'Baixar contatos deste filtro (CSV)'}</button>
                    </div>
                    <p role="status" className="mt-3 text-xs text-slate-600">{loading ? 'Consultando a Meta no histórico do CRM…' : `${total} contato(s) neste filtro.`} {updatedAt && `Atualizado às ${updatedAt}.`} Atualização a cada 15 segundos enquanto esta tela estiver aberta.</p>
                    {error && <p role="alert" className="mt-3 rounded-xl bg-red-50 p-3 text-xs text-red-700">{error}</p>}
                    {!loading && <div className="mt-3 max-h-80 space-y-2 overflow-y-auto" aria-label="Lista de contatos separados por entrega">
                        {rows.map(row => <div key={row._id || row.phone} className="rounded-xl border border-slate-200 p-3 text-xs">
                            <div className="flex flex-wrap justify-between gap-2"><strong>{row.name || 'Sem nome'} · <span className="font-mono">{row.phone}</span></strong><span className={row.deliveryStatus === 'failed' ? 'font-bold text-red-700' : 'font-bold text-slate-600'}>{deliveryLabels[row.deliveryStatus] || 'A conferir'}</span></div>
                            {row.deliveryStatus === 'failed' && <p className="mt-2 text-slate-700">{deliveryGuidance(row.deliveryError)}</p>}
                            {row.deliveryError && <p className="mt-1 break-words text-slate-600">Retorno original: {row.deliveryError}</p>}
                            {row.deliveryStatus === 'failed' && !row.deliveryError && <p className="mt-1 text-slate-500">O CRM não tem o motivo desta falha registrado. Confira o Gerenciador do WhatsApp.</p>}
                        </div>)}
                        {!rows.length && <p className="rounded-xl bg-slate-50 p-3 text-xs text-slate-600">Nenhum contato neste filtro. Isso não confirma que todos receberam: confira também os outros filtros.</p>}
                    </div>}
                    {total > 200 && <div className="mt-3 flex items-center gap-3 text-xs"><button type="button" disabled={page === 1 || loading || exporting} onClick={() => setPage(value => value - 1)} className="rounded-lg border p-2 disabled:opacity-50">Anterior</button><span>Página {page} de {Math.ceil(total / 200)}</span><button type="button" disabled={page * 200 >= total || loading || exporting} onClick={() => setPage(value => value + 1)} className="rounded-lg border p-2 disabled:opacity-50">Próxima</button></div>}
                    <p className="mt-3 text-xs text-slate-500">Baixar a lista não envia mensagens, não altera tags e não libera reenvios. Antes de outra oferta, revise o motivo, o consentimento e o risco de duplicar envios sem confirmação.</p>
                </section>
            );
        };

        const DeliveryQueues = ({ rows, loading, error, updatedAt, onRefresh, onChat }) => {
            const [queue, setQueue] = useState('failed');
            const [query, setQuery] = useState('');
            const filtered = rows.filter(row => row.queue === queue && `${row.name} ${row.phone}`.toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR')));
            const [limit, setLimit] = useState(100);
            return (
                <div className="h-full overflow-y-auto p-4 md:p-8">
                    <h2 className="text-2xl font-black text-purple-800">Entregas e falhas</h2>
                    <p className="mt-3 max-w-3xl text-sm text-slate-600">Falhas confirmadas ficam separadas da lista de Conversas, sem excluir o contato ou mudar suas tags. Quem recebeu continua na triagem em Conversas, para atendimento e organização em Já trabalhados.</p>
                    <p className="mt-2 max-w-3xl text-xs text-slate-500">A separação usa o último envio registrado para cada telefone, inclusive do histórico antigo disponível. Uma nova entrega confirmada ou uma resposta posterior do cliente devolve o contato à triagem. Aceita pela API não significa entregue. Nenhum reenvio é feito aqui.</p>
                    <div className="my-4 flex flex-wrap gap-2" role="tablist" aria-label="Filas de entrega">
                        {[['failed', 'Falhas de entrega'], ['unconfirmed', 'Aguardando confirmação'], ['triage', 'Triagem — recebidos / responderam']].map(([key, label]) => (
                            <button type="button" role="tab" aria-selected={queue === key} key={key} onClick={() => { setQueue(key); setLimit(100); }} className={`rounded-xl border px-4 py-3 text-xs font-bold ${queue === key ? 'border-purple-700 bg-purple-700 text-white' : 'border-slate-200 bg-white text-slate-700'}`}>
                                {label} ({updatedAt || CRM_PREVIEW ? rows.filter(row => row.queue === key).length : '—'})
                            </button>
                        ))}
                    </div>
                    <div className="mb-4 flex flex-wrap items-center gap-3">
                        <input type="search" aria-label="Buscar contato na fila de entrega" placeholder="Buscar nome ou telefone" value={query} onChange={event => { setQuery(event.target.value); setLimit(100); }} className="rounded-xl border border-slate-200 bg-white p-3 text-sm" />
                        <button type="button" disabled={loading || CRM_PREVIEW} onClick={onRefresh} className="rounded-xl bg-purple-700 px-4 py-3 text-xs font-bold text-white disabled:opacity-50">{loading ? 'Consultando…' : 'Atualizar filas'}</button>
                        <button type="button" disabled={!filtered.length || CRM_PREVIEW} onClick={() => downloadDeliveryCsv(filtered.map(row => ({ ...row, deliveryStatus: row.status === 'sent' || row.status === 'sending' ? 'accepted' : row.status, deliveryError: row.error })), queue)} className="rounded-xl border border-purple-200 bg-white px-4 py-3 text-xs font-bold text-purple-700 disabled:opacity-50">Baixar esta lista (CSV)</button>
                    </div>
                    <p role="status" className="mb-4 text-xs text-slate-500">{updatedAt || CRM_PREVIEW ? `${filtered.length} contato(s) nesta lista.` : 'Ainda sem sincronização válida — a quantidade de falhas é desconhecida.'} {updatedAt && `Última sincronização válida às ${updatedAt}.`} Atualização automática 15 segundos após cada consulta. Em caso de erro, nova tentativa em 1 minuto para não sobrecarregar o banco; você também pode usar Atualizar filas. {CRM_PREVIEW && 'Prévia sem dados reais.'}</p>
                    {error && <p role="alert" className="mb-4 rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-700">{error}</p>}
                    {error?.includes('DELIVERY_QUERY_TIMEOUT') && <div className="mb-4 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">
                        <p className="font-bold">A consulta do histórico demorou demais no servidor.</p>
                        <p className="mt-2">A correção desta consulta precisa ser publicada no Railway com o arquivo backend/server.cjs atualizado; atualizar só esta página não atualiza o servidor. Depois do deploy, use Atualizar filas.</p>
                        <p className="mt-2 text-xs">Se o erro continuar, consulte nos logs do Railway as linhas DeliveryQueue para identificar a etapa que excedeu o tempo. Os dados anteriores são mantidos; não reenvie mensagens para testar a sincronização.</p>
                    </div>}
                    {queue === 'unconfirmed' && <p className="mb-4 rounded-xl bg-amber-50 p-3 text-xs text-amber-800">Estes contatos não têm falha confirmada. Podem receber depois ou já ter recebido sem um retorno salvo. Confira antes de reenviar; eles não são retirados de Conversas por falta de confirmação.</p>}
                    <div className="space-y-3">
                        {filtered.slice(0, limit).map(row => <article key={row.phone} className="rounded-2xl border border-slate-200 bg-white p-4">
                            <div className="flex flex-wrap items-center justify-between gap-3">
                                <div><h3 className="text-sm font-bold text-slate-800">{row.name || row.phone}</h3><p className="font-mono text-xs text-slate-600">{row.phone}</p></div>
                                <span className={`text-xs font-bold ${row.queue === 'failed' ? 'text-red-700' : 'text-slate-600'}`}>{row.queue === 'triage' ? 'Na triagem' : deliveryLabels[row.status] || 'Sem confirmação'}</span>
                                <button type="button" onClick={() => onChat(row.phone)} className="rounded-xl border border-purple-200 px-3 py-2 text-xs font-bold text-purple-700">Abrir conversa</button>
                            </div>
                            {row.queue === 'failed' && <p className="mt-3 text-xs text-slate-700">{deliveryGuidance(row.error)}</p>}
                            {row.error && <p className="mt-2 break-words text-xs text-slate-500">Retorno original: {row.error}</p>}
                            {row.queue === 'failed' && !row.error && <p className="mt-2 text-xs text-slate-500">Motivo não disponível no histórico salvo.</p>}
                            <p className="mt-2 text-xs text-slate-400">Último envio: {new Date(row.timestamp).toLocaleString('pt-BR')}</p>
                        </article>)}
                        {!filtered.length && !loading && !error && <p className="rounded-xl bg-white p-5 text-sm text-slate-500">Nenhum contato nesta lista com os dados disponíveis.</p>}
                        {filtered.length > limit && <button type="button" onClick={() => setLimit(value => value + 100)} className="rounded-xl border border-purple-200 bg-white p-3 text-xs font-bold text-purple-700">Mostrar mais 100 contatos</button>}
                    </div>
                    <p className="mt-5 text-xs text-slate-500">Esta organização não move tags inteiras para Já trabalhados. Em Tags, revise os contatos antes de mover uma tag que também contenha falhas. Resultados antigos que não foram gravados não podem ser recuperados pela tela.</p>
                </div>
            );
        };

        // Limita também a leitura do corpo: uma conexão aberta não pode travar o botão.
        const campaignRequest = async (url, options = {}, timeoutMs = 30000, timeoutMessage = 'O servidor demorou para responder. Confira o histórico antes de tentar novamente.') => {
            const controller = new AbortController();
            let timer;
            try {
                return await Promise.race([
                    (async () => {
                        const response = await fetch(url, { ...options, signal: controller.signal });
                        const data = await response.json().catch(error => {
                            if (controller.signal.aborted) throw error;
                            return {};
                        });
                        return { response, data };
                    })(),
                    new Promise((_, reject) => {
                        timer = setTimeout(() => {
                            reject(new Error(timeoutMessage));
                            controller.abort();
                        }, timeoutMs);
                    })
                ]);
            } finally {
                clearTimeout(timer);
            }
        };

        const requestDeliveryQueues = async () => {
            const path = '/api/messages/delivery-queue';
            try {
                const { response, data } = await campaignRequest(path, { cache: 'no-store' }, 30000,
                    'A consulta das entregas excedeu 30 segundos. Os resultados anteriores foram mantidos; tente Atualizar filas.');
                if (response.status === 404 || (response.ok && Array.isArray(data))) {
                    throw new Error(`A rota de entregas não está disponível neste servidor (HTTP ${response.status}). Publique backend/server.cjs atualizado no Railway e confirme o Start Command: node server.js, com server.js na raiz. Uma lista de mensagens não é uma sincronização das falhas.`);
                }
                if (!response.ok) {
                    const detail = typeof data.error === 'string' ? data.error : 'O servidor não informou o motivo.';
                    throw new Error(`Falha ao consultar entregas (HTTP ${response.status}${data.code ? ', ' + data.code : ''}): ${detail}`);
                }
                if (!Array.isArray(data.rows) || data.rows.some(row => !row || typeof row.phone !== 'string' || !['failed', 'unconfirmed', 'triage'].includes(row.queue))) {
                    throw new Error('O servidor não retornou uma fila de entregas válida. Confira a versão de backend/server.cjs publicada no Railway; nenhuma separação nova foi aplicada.');
                }
                return { response, data };
            } catch (error) {
                if (error instanceof TypeError) {
                    throw new Error('Sem conexão com o servidor do CRM. Confira se o Railway está online e permite o acesso desta página (CORS). Os resultados anteriores foram mantidos.');
                }
                throw error;
            }
        };

        const summarizeDispatchDeliveries = (progress, deliveries) => {
            const results = (progress.results || []).map(result => {
                const rank = { read: 4, delivered: 3, failed: 2 };
                const message = [result.wamid ? deliveries[result.wamid] : null,
                    progress.campaignId ? deliveries[`${progress.campaignId}:${result.phone}`] : null]
                    .filter(Boolean).sort((a, b) => (rank[b.status] || 1) - (rank[a.status] || 1))[0];
                const status = ['failed', 'delivered', 'read'].includes(message?.status)
                    ? message.status : result.status === 'sent' ? 'accepted' : result.status;
                const detail = status === 'failed' && message?.status === 'failed'
                    ? message.error || 'Falha confirmada pela Meta, sem motivo registrado.'
                    : status === 'read' ? 'Leitura confirmada pela Meta.'
                    : status === 'delivered' ? 'Entrega confirmada pela Meta.' : result.detail;
                return { ...result, status, detail };
            });
            const count = status => results.filter(result => result.status === status).length;
            return { results, failed: count('failed'), confirmed: count('delivered') + count('read'),
                accepted: count('accepted'), uncertain: count('uncertain'),
                untrackable: results.filter(result => result.status === 'accepted' && !result.wamid).length };
        };

        const mergeDeliverySnapshots = (current, incoming) => {
            const rank = { read: 4, delivered: 3, failed: 2 };
            const next = { ...current };
            Object.entries(incoming).forEach(([id, message]) => {
                if ((rank[message.status] || 1) >= (rank[next[id]?.status] || 0)) next[id] = message;
            });
            return next;
        };

        const DispatchResults = ({ progress, onStop, sharedDeliveries = {}, onDeliveries }) => {
            const [deliveries, setDeliveries] = useState({});
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [updatedAt, setUpdatedAt] = useState('');
            const currentProgress = useRef(progress);
            currentProgress.current = progress;
            const refreshRef = useRef(null);
            useEffect(() => {
                let cancelled = false, fetching = false;
                const refresh = async () => {
                    if (CRM_PREVIEW || fetching || cancelled) return;
                    const ids = [...new Set((currentProgress.current.results || []).map(row => row.wamid).filter(Boolean))];
                    if (!ids.length) return;
                    fetching = true;
                    setLoading(true);
                    try {
                        const found = {};
                        for (let i = 0; i < ids.length; i += 200) {
                            const { response, data } = await campaignRequest('/api/messages/delivery-report', {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ wamids: ids.slice(i, i + 200) })
