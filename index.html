                            }, 20000, 'A consulta das falhas excedeu 20 segundos. Os últimos resultados foram mantidos.');
                            if (!response.ok || !Array.isArray(data.messages)) throw new Error(data.error || 'Não foi possível consultar as falhas. Confira a publicação do backend no Railway.');
                            data.messages.forEach(message => { found[message.wamid] = message; });
                            if (cancelled) return;
                        }
                        if (!cancelled) {
                            setDeliveries(current => mergeDeliverySnapshots(current, found));
                            if (onDeliveries) onDeliveries(found);
                            setUpdatedAt(new Date().toLocaleTimeString('pt-BR'));
                            setError('');
                        }
                    } catch (err) { if (!cancelled) setError(err.message || 'Falha ao consultar as entregas.'); }
                    finally { fetching = false; if (!cancelled) setLoading(false); }
                };
                refreshRef.current = refresh;
                refresh();
                const timer = setInterval(refresh, 5000);
                return () => { cancelled = true; clearInterval(timer); };
            }, [progress.running]);
            const summary = summarizeDispatchDeliveries(progress, mergeDeliverySnapshots(deliveries, sharedDeliveries));
            return <section aria-label="Contagem e resultados do disparo" className="mt-3 rounded-2xl border border-purple-200 bg-purple-50 p-4 text-xs text-purple-900">
                <h3 className="font-black">{progress.running ? 'Disparo em andamento' : progress.pending ? 'Disparo pausado' : 'Resultado do disparo'}</h3>
                <p role="status" aria-live="polite" className="mt-2 text-sm font-black">{progress.total - progress.pending} de {progress.total} contatos processados</p>
                <progress aria-label="Progresso deste disparo" value={progress.total - progress.pending} max={progress.total || 1} className="mt-2 h-3 w-full" />
                <div aria-label="Resultado atualizado com retornos da Meta" className="mt-3 grid grid-cols-2 gap-2">
                    {[
                        ['Falhas confirmadas', summary.failed > 0 || updatedAt ? summary.failed : '—', 'bg-red-100 text-red-800'],
                        ['Entregues / lidas', updatedAt ? summary.confirmed : '—', 'bg-emerald-100 text-emerald-800'],
                        ['Sem confirmação de entrega', summary.accepted, 'bg-amber-100 text-amber-800'],
                        ['Resultado incerto', summary.uncertain, 'bg-orange-100 text-orange-800'],
                        ['Não tentados', progress.pending, 'bg-slate-100 text-slate-700']
                    ].map(([label, count, color]) => <div key={label} className={`rounded-xl p-3 ${color}`}><div className="font-bold">{label}</div><div className="mt-1 text-xl font-black">{count}</div></div>)}
                </div>
                <p className="mt-3">Recusas imediatas da API: <strong>{progress.failed}</strong>. Falhas confirmadas acima incluem também os erros posteriores da Meta. Aceite inicial não é entrega.</p>
                {summary.failed > 0 && <p role="alert" className="mt-3 rounded-xl border border-red-200 bg-red-50 p-3 font-bold text-red-800">{summary.failed} mensagem(ns) falharam. Confira o motivo em cada número abaixo. Não reenvie automaticamente.</p>}
                <div className="mt-3 flex flex-wrap items-center gap-2">
                    <button type="button" disabled={loading || CRM_PREVIEW} onClick={() => refreshRef.current?.()} className="rounded-lg border border-purple-300 px-3 py-2 font-bold disabled:opacity-50">{loading ? 'Consultando falhas…' : 'Atualizar entregas e falhas'}</button>
                    <span role="status">{updatedAt ? `Histórico consultado às ${updatedAt}.` : 'Aguardando consulta dos retornos.'} Atualização automática a cada 5 segundos.</span>
                </div>
                {error && <p role="alert" className="mt-3 rounded-xl bg-red-50 p-3 font-bold text-red-700">{error} Sem consulta válida, não é possível afirmar que não houve falhas.</p>}
                {summary.untrackable > 0 && <p role="alert" className="mt-3 rounded-xl bg-amber-100 p-3 text-amber-900">{summary.untrackable} aceite(s) sem identificador de mensagem: não é possível conferir a entrega neste resumo. Consulte a conversa e atualize o backend.</p>}
                {progress.currentPhone && <p className="mt-3 font-bold">Enviando para: <span className="font-mono">{progress.currentPhone}</span></p>}
                <p className="mt-3">Estimativa dos aceites iniciais: <strong>R$ {(progress.sent * 0.32).toFixed(2).replace('.', ',')}</strong>. Não é confirmação de entrega nem de cobrança.</p>
                {progress.running && <button type="button" onClick={onStop} className="mt-3 rounded-lg bg-slate-700 px-3 py-2 font-bold text-white">Parar após o contato atual</button>}
                <h4 className="mt-4 font-black">Resultado por número · falhas primeiro</h4>
                <div className="mt-2 max-h-60 space-y-2 overflow-y-auto" aria-label="Resultados por telefone">
                    {summary.results.slice().reverse().sort((a, b) => Number(b.status === 'failed') - Number(a.status === 'failed')).map((result, index) => <div key={`${result.phone}-${index}`} className={`rounded-xl border p-3 ${result.status === 'failed' ? 'border-red-300 bg-red-50' : 'border-purple-200 bg-white'}`}>
                        <div className="flex flex-wrap items-center justify-between gap-2">
                            <span className="font-mono font-bold text-slate-800">{result.phone}</span>
                            <span className={`rounded-full px-2 py-1 font-bold ${result.status === 'failed' ? 'bg-red-100 text-red-800' : ['delivered', 'read'].includes(result.status) ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>{deliveryLabels[result.status] || 'A conferir'}</span>
                        </div>
                        <p className="mt-1 break-words text-slate-600">{result.detail}</p>
                        {result.status === 'failed' && <p className="mt-2 font-bold text-red-800">{deliveryGuidance(result.detail)}</p>}
                    </div>)}
                    {!summary.results.length && <p className="text-slate-600">Aguardando o resultado do primeiro contato…</p>}
                </div>
                <p className="mt-3 text-slate-500">Retornos consultados no histórico do CRM por identificador de mensagem. Dependem do recebimento do webhook da Meta; ausência de retorno não comprova entrega. Esta lista não é preservada ao sair ou recarregar.</p>
            </section>;
        };

        const calculateFinancialSummary = (counts, unitPrice, invoice) => {
            const accepted = Math.max(0, Number(counts.accepted) || 0);
            const delivered = Math.max(0, Number(counts.delivered) || 0);
            const estimated = accepted * Math.max(0, Number(unitPrice) || 0);
            const actual = invoice !== '' && Number.isFinite(Number(invoice)) && Number(invoice) >= 0 ? Number(invoice) : null;
            const basis = actual === null ? estimated : actual;
            return { accepted, delivered, estimated, actual, basis,
                perAccepted: accepted ? basis / accepted : null,
                perDelivered: delivered ? basis / delivered : null };
        };

        const FinanceControl = ({ campaign, progress, campaigns, deliveries }) => {
            const [scope, setScope] = useState('selected');
            const [unitPrice, setUnitPrice] = useState('0.32');
            const [entries, setEntries] = useState({});
            const [storageReady, setStorageReady] = useState(false);
            const [storageError, setStorageError] = useState('');
            useEffect(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('crm-finance-v1') || '{}');
                    if (Number.isFinite(Number(saved.unitPrice)) && Number(saved.unitPrice) >= 0) setUnitPrice(String(saved.unitPrice));
                    if (saved.entries && typeof saved.entries === 'object') setEntries(saved.entries);
                } catch { setStorageError('Não foi possível recuperar os controles deste navegador.'); }
                setStorageReady(true);
            }, []);
            useEffect(() => {
                if (!storageReady) return;
                try { localStorage.setItem('crm-finance-v1', JSON.stringify({ unitPrice, entries })); }
                catch { setStorageError('O navegador não permitiu salvar. Os valores ficam apenas nesta tela.'); }
            }, [unitPrice, entries, storageReady]);
            const all = scope === 'loaded';
            const key = all ? `loaded:${campaigns.map(item => String(item._id)).sort().join(',')}` : campaign ? `campaign:${campaign._id}` : progress ? `run:${progress.runId}` : 'none';
            const entry = entries[key] || { invoice: '', budget: '' };
            const change = (field, value) => setEntries(current => ({ ...current, [key]: { ...(current[key] || { invoice: '', budget: '' }), [field]: value } }));
            const source = all ? campaigns : campaign ? [campaign] : [];
            const run = !all && !campaign && progress ? summarizeDispatchDeliveries(progress, deliveries) : null;
            const counts = run ? { accepted: progress.sent, delivered: run.confirmed, failed: run.failed }
                : source.reduce((sum, item) => ({ accepted: sum.accepted + Number(item.sentCount || 0),
                    delivered: sum.delivered + Number(item.deliveredCount || 0), failed: sum.failed + Number(item.deliveryFailedCount || 0) }), { accepted: 0, delivered: 0, failed: 0 });
            const finance = calculateFinancialSummary(counts, unitPrice, entry.invoice);
            const deliveriesPending = source.some(item => item.deliverySummaryPending);
            if (deliveriesPending) {
                finance.delivered = null;
                finance.perDelivered = null;
                counts.failed = null;
            }
            const money = value => value === null ? '—' : Number(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            const hasData = !!(run || source.length);
            const budget = entry.budget === '' ? null : Math.max(0, Number(entry.budget) || 0);
            const download = () => {
                const rows = [['Indicador', 'Valor'], ['Recorte', all ? `${campaigns.length} campanhas carregadas` : campaign?.name || progress?.name || 'Sem seleção'],
                    ['Aceites iniciais', finance.accepted], ['Entregues ou lidas', finance.delivered ?? 'Não consultado'], ['Falhas confirmadas', counts.failed ?? 'Não consultado'],
                    ['Tarifa estimada BRL', unitPrice], ['Custo estimado BRL', finance.estimated], ['Fatura informada BRL', finance.actual ?? 'Não informada'],
                    ['Custo médio por aceite BRL', finance.perAccepted ?? 'Sem base'], ['Custo médio por entrega BRL', finance.perDelivered ?? 'Sem base'],
                    ['Observação', 'Estimativa não comprova cobrança; fatura preenchida manualmente.']];
                const cell = value => '"' + (/^[\s]*[=+\-@]/.test(String(value)) ? "'" : '') + String(value).replace(/"/g, '""') + '"';
                const url = URL.createObjectURL(new Blob(['\uFEFF' + rows.map(row => row.map(cell).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8;' }));
                const link = document.createElement('a'); link.href = url; link.download = 'controle-financeiro.csv'; document.body.appendChild(link); link.click(); link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };
            return <section aria-label="Controle financeiro dos disparos" className="mb-5 rounded-2xl border border-purple-200 bg-white p-4">
                <h3 className="font-black text-purple-800">Controle financeiro · custo médio</h3>
                <p className="mt-2 text-xs text-slate-600">Acompanhe estimativas e compare com a fatura. Não há integração automática com a cobrança da Meta.</p>
                <label className="mt-3 block text-xs font-bold text-slate-700">Recorte do controle
                    <select value={scope} onChange={event => setScope(event.target.value)} className="mt-1 block w-full rounded-xl border p-2 text-sm">
                        <option value="selected">{campaign ? `Campanha selecionada: ${campaign.name}` : 'Última execução nesta tela'}</option>
                        <option value="loaded">Campanhas carregadas ({campaigns.length}, até 100)</option>
                    </select>
                </label>
                <p className="mt-2 text-xs text-slate-500">{all ? 'Somente as campanhas retornadas pelo histórico, sem filtro de período. Não representa todo o faturamento da conta; envios diretos ficam fora.' : campaign ? 'Totais acumulados da campanha selecionada, sem somar novamente a execução atual.' : 'Somente a execução atual; não é um histórico financeiro permanente.'}</p>
                <div className="mt-3 grid gap-3 sm:grid-cols-3">
                    {[
                        ['Tarifa estimada por aceite (R$)', unitPrice, value => setUnitPrice(value)],
                        ['Valor real da fatura deste recorte (R$)', entry.invoice, value => change('invoice', value)],
                        ['Orçamento deste recorte (R$)', entry.budget, value => change('budget', value)]
                    ].map(([label, value, onChange]) => <label key={label} className="text-xs font-bold text-slate-700">{label}<input type="number" min="0" step="0.01" value={value} placeholder="Não informado" onChange={event => onChange(event.target.value)} className="mt-1 block w-full rounded-xl border p-2 text-sm font-normal" /></label>)}
                </div>
                <p className="mt-2 text-xs text-slate-500">A tarifa serve apenas para simular este controle; não altera o envio nem os avisos de R$ 0,32. Preencha a fatura apenas com o valor referente ao recorte escolhido.</p>
                {!hasData ? <p className="mt-3 rounded-xl bg-slate-50 p-3 text-xs">Escolha uma campanha ou inicie um disparo para calcular os custos.</p> : <>
                    <div className="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-3">
                        {[
                            ['Estimativa sobre aceites', money(finance.estimated)], ['Fatura informada', money(finance.actual)],
                            ['Média por aceite inicial', money(finance.perAccepted)], ['Média por entrega confirmada', money(finance.perDelivered)],
                            ['Aceites iniciais', finance.accepted], ['Entregues / lidas', finance.delivered ?? '—']
                        ].map(([label, value]) => <div key={label} className="rounded-xl bg-purple-50 p-3 text-purple-900"><div className="text-xs font-bold">{label}</div><strong className="text-lg">{value}</strong></div>)}
                    </div>
                    <p role="status" className="mt-3 text-xs text-slate-600">Médias calculadas com {finance.actual === null ? 'o custo estimado, não uma cobrança confirmada' : 'a fatura informada manualmente'}. Sem aceites ou entregas, a média correspondente fica indisponível. Falhas confirmadas: {counts.failed ?? 'não consultado'}; não são prova de cobrança e não são descontadas de uma fatura real.</p>
                    {deliveriesPending && <p className="mt-2 text-xs text-amber-800">O histórico rápido consulta reservas e tentativas, sem cruzar todas as mensagens. Selecione uma campanha e aguarde o relatório de entregas para consultar seus números; as demais permanecem sem dados de entrega neste recorte.</p>}
                    {budget !== null && <p className={`mt-3 rounded-xl p-3 text-xs font-bold ${finance.basis > budget ? 'bg-red-50 text-red-800' : 'bg-emerald-50 text-emerald-800'}`}>{finance.basis > budget ? 'Acima do orçamento em ' : 'Saldo do orçamento: '}{money(Math.abs(budget - finance.basis))}. Apenas acompanhamento: não interrompe disparos.</p>}
                    <button type="button" onClick={download} className="mt-3 rounded-xl bg-purple-700 px-3 py-2 text-xs font-bold text-white">Baixar controle financeiro (CSV)</button>
                </>}
                <p className="mt-3 text-xs text-slate-500">Tarifa, orçamento e fatura são salvos somente neste navegador, sem sincronização entre usuários. Entregas dependem dos retornos registrados no CRM.</p>
                {storageError && <p role="alert" className="mt-2 text-xs text-red-700">{storageError}</p>}
            </section>;
        };

        const BulkView = memo(({ leads, templates, config, onLeadsUpdate, onMoveTag, initialTag = null }) => {
            const [sel, setSel] = useState(() => initialTag ? leads.filter(lead => (lead.tags || []).includes(initialTag)).map(lead => lead.phone) : []); 
            const [tpl, setTpl] = useState(null); 
            const [file, setFile] = useState(null); 
            const [busy, setBusy] = useState(false);
            const [preparationStage, setPreparationStage] = useState('');
            const [preparationElapsed, setPreparationElapsed] = useState(0);
            useEffect(() => {
                setPreparationElapsed(0);
                if (!preparationStage) return;
                const startedAt = Date.now();
                const timer = setInterval(() => setPreparationElapsed(Math.floor((Date.now() - startedAt) / 1000)), 1000);
                return () => clearInterval(timer);
            }, [preparationStage]);
            const preparationRef = useRef(false);
            const [prog, setProg] = useState({c:0, t:0});
            const [filterTags, setFilterTags] = useState(() => initialTag ? [initialTag] : []);
            const [tagScope, setTagScope] = useState(() => (config?.workedTags || []).includes(initialTag) ? 'worked' : 'active');
            const previousWorkedTags = useRef(config?.workedTags);
            useEffect(() => {
                if (previousWorkedTags.current !== config?.workedTags) { setFilterTags([]); setSel([]); }
                previousWorkedTags.current = config?.workedTags;
            }, [config?.workedTags]);
            const fRef = useRef(null);
            const excelRef = useRef(null);
            const [excelLoading, setExcelLoading] = useState(false);
            const [excelResult, setExcelResult] = useState(null);
            const [importedPhones, setImportedPhones] = useState([]);
            const [excelMode, setExcelMode] = useState(false);
            const [roundName, setRoundName] = useState('Remarketing 2ª rodada');
            const [campaignName, setCampaignName] = useState('');
            const [campaigns, setCampaigns] = useState([]);
            const [activeCampaign, setActiveCampaign] = useState(null);
            const [campaignHistoryOpen, setCampaignHistoryOpen] = useState(false);
            const [campaignError, setCampaignError] = useState('');
            const [sendConfirmation, setSendConfirmation] = useState(null);
            const stopCampaignRef = useRef(false);
            const directSendRef = useRef(false);
            const [directProgress, setDirectProgress] = useState(null);
            const [historyUnavailable, setHistoryUnavailable] = useState(false);
            const [sharedDeliveries, setSharedDeliveries] = useState({});
            const receiveDeliveries = incoming => setSharedDeliveries(current => mergeDeliverySnapshots(current, incoming));

            const [campaignHistoryError, setCampaignHistoryError] = useState('');
            const [campaignHistoryLoading, setCampaignHistoryLoading] = useState(false);
            const historyRequestRef = useRef(null);
            const refreshCampaigns = () => {
                if (CRM_PREVIEW) return Promise.resolve([]);
                if (historyRequestRef.current) return historyRequestRef.current;
                setCampaignHistoryLoading(true);
                setCampaignHistoryError('');
                const request = (async () => {
                    const { response, data } = await campaignRequest('/api/remarketing/campaigns?summary=dispatch', { cache: 'no-store' }, 30000, 'A consulta de Campanhas salvas excedeu 30 segundos. Isso não confirma falha no envio. Atualize o histórico antes de repetir uma preparação que ficou sem confirmação; não troque a rodada para contornar repetidos.');
                    if ([404, 405].includes(response.status)) {
                        setHistoryUnavailable(true);
                        return [];
                    }
                    if (!response.ok) throw new Error(data.error || `Não foi possível carregar as campanhas (HTTP ${response.status}).`);
                    if (!Array.isArray(data)) throw new Error('O servidor retornou um histórico inválido. A última lista válida foi mantida.');
                    setHistoryUnavailable(false);
                    setCampaigns(data);
                    setActiveCampaign(current => current
                        ? (data.find(item => String(item._id) === String(current._id)) || current)
                        : current);
                    return data;
                })().catch(error => {
                    setCampaignHistoryError(error.message || 'Não foi possível consultar as campanhas.');
                    throw error;
                }).finally(() => {
                    historyRequestRef.current = null;
                    setCampaignHistoryLoading(false);
                });
                historyRequestRef.current = request;
                return request;
            };

            useEffect(() => {
                refreshCampaigns().catch(() => {});
            }, []);

            const exitExcelMode = () => {
                setExcelMode(false);
                setImportedPhones([]);
                setSel([]);
                setExcelResult(null);
            };

            const handleExcelImport = async (e) => {
                const f = e.target.files[0];
                if (!f) return;
                e.target.value = '';
                setExcelLoading(true);
                setExcelResult(null);
                try {
                    const reader = new FileReader();
                    reader.onload = async (ev) => {
                        try {
                            const res = await fetch('/api/excel/parse', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ excelData: ev.target.result })
                            });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Erro ao processar');
                            const contacts = data.contacts || data.phones.map(p => ({ phone: p, name: '' }));
                            if (contacts.length === 0) {
                                setExcelResult({ count: 0 });
                                setExcelLoading(false);
                                return;
                            }
                            await fetch('/api/leads/batch', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ contacts, phones: contacts.map(c => c.phone) })
                            });
                            setImportedPhones(contacts);
                            setSel(contacts.map(c => c.phone));
                            setExcelMode(true);
                            setExcelResult({ count: contacts.length });
                            if (onLeadsUpdate) onLeadsUpdate();
                        } catch (err) {
                            alert('Erro ao importar Excel: ' + err.message);
                        }
                        setExcelLoading(false);
                    };
                    reader.readAsDataURL(f);
                } catch (err) {
                    alert('Erro ao ler arquivo: ' + err.message);
                    setExcelLoading(false);
                }
            };

            const tagColors = config?.tagColors || {};
            const leadTags = (leads || []).flatMap(l => Array.isArray(l.tags) ? l.tags : []);
            const allTags = [...new Set([...Object.keys(tagColors).reverse(), ...leadTags])];
            const workedTags = config?.workedTags || [];
            const availableTags = allTags.filter(tag => workedTags.includes(tag) === (tagScope === 'worked'));
            const filteredLeads = useMemo(() => {
                if (excelMode) {
                    return importedPhones.map(c => {
                        const phone = typeof c === 'string' ? c : c.phone;
                        const name = typeof c === 'string' ? '' : (c.name || '');
                        const existing = (leads || []).find(l => l.phone === phone);
                        return existing
                            ? { ...existing, _fromExcel: true }
                            : { phone, name, tags: [], _fromExcel: true };
                    });
                }
                const scopeLeads = (leads || []).filter(lead => {
                    const tags = lead.tags || [];
                    return tags.some(tag => availableTags.includes(tag)) || (tagScope === 'active' && tags.length === 0);
                });
                return filterTags.length
                    ? scopeLeads.filter(l => (l.tags || []).some(tag => filterTags.includes(tag)))
                    : scopeLeads;
            }, [leads, filterTags, importedPhones, excelMode, config?.workedTags, config?.tagColors, tagScope]);

            const selectCampaign = (campaign) => {
                setActiveCampaign(campaign);
                setCampaignHistoryOpen(false);
                setRoundName(campaign.roundName || '');
                setCampaignName('');
                setTpl(templates.find(template => template.name === campaign.templateName) || {
                    name: campaign.templateName,
                    language: campaign.languageCode || 'pt_BR',
                    components: [{ type: 'BODY', text: campaign.templateText || '' }]
                });
                setSel([]);
                setCampaignError('');
            };

            const sendDirect = async (campaign) => {
                if (CRM_PREVIEW || busy || directSendRef.current) return;
                directSendRef.current = true;
                setSendConfirmation(null);
                setActiveCampaign(null);
                setCampaignError('');
                setBusy(true);
                stopCampaignRef.current = false;
                const phones = [...new Set(campaign.phones)];
                const results = [];
                const runId = `direct-${Date.now()}`;
                let sent = 0, failed = 0, uncertain = 0, processed = 0;
                const update = (running) => {
                    setProg({ c: processed, t: phones.length, erros: failed, incertos: uncertain });
                    setDirectProgress({ runId, name: campaign.name, mode: 'direct', phones, total: phones.length, sent, failed, uncertain, pending: phones.length - processed, running, currentPhone: running && !stopCampaignRef.current ? phones[processed] : null, results: [...results] });
                };
                update(true);
                try {
                    for (const phone of phones) {
                        if (stopCampaignRef.current) break;
                        // Retira a tentativa da seleção antes da requisição: nunca repete automaticamente.
                        setSel(current => current.filter(item => item !== phone));
                        try {
                            const { response, data } = await campaignRequest('/api/messages/send', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    phone,
                                    templateName: campaign.templateName,
                                    languageCode: campaign.languageCode || 'pt_BR',
                                    messageText: campaign.templateText || campaign.templateName,
                                    mediaId: campaign.headerMediaId || undefined
                                })
                            }, 60000, 'O servidor não confirmou este contato em 60 segundos. O resultado é incerto: confira a conversa antes de qualquer nova tentativa.');
                            if (response.ok && data.success === true) {
                                sent++;
                                results.push({ phone, wamid: data.wamid || null, status: 'sent', detail: 'Aceito pelo servidor; entrega não confirmada.' });
                            } else if (response.ok || response.status >= 500 || response.status === 0) {
                                uncertain++;
                                results.push({ phone, status: 'uncertain', detail: data.error || 'O servidor não confirmou o resultado. Confira a conversa antes de repetir.' });
                                stopCampaignRef.current = true;
                                setCampaignError('Envio pausado: o servidor não confirmou o resultado do último contato. Confira a conversa antes de tentar esse número novamente.');
                            } else {
                                failed++;
                                results.push({ phone, status: 'failed', detail: data.error || `Envio recusado pelo servidor (${response.status}).` });
                                setCampaignError(data.error || `Envio recusado pelo servidor (${response.status}).`);
                                if ([401, 403, 404, 405, 429].includes(response.status)) stopCampaignRef.current = true;
                            }
                        } catch (error) {
                            uncertain++;
                            const detail = error.message || 'Conexão interrompida. Confira a última conversa antes de repetir o envio; o resultado desse contato é incerto.';
                            results.push({ phone, status: 'uncertain', detail });
                            stopCampaignRef.current = true;
                            setCampaignError(detail);
                        }
                        processed++;
                        update(true);
                        if (!stopCampaignRef.current && processed < phones.length) await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                } finally {
                    update(false);
                    directSendRef.current = false;
                    setBusy(false);
                }
            };

            const createCampaign = async (sendNow = false) => {
                if (busy || preparationRef.current || directSendRef.current) return;
                if (!tpl) { setCampaignError('Selecione um template na etapa 1 antes de enviar.'); return; }
                if (sel.length === 0) { setCampaignError('Selecione pelo menos um contato na etapa 2 antes de enviar.'); return; }
                if (CRM_PREVIEW) { setCampaignError('O envio está desativado na demonstração. Use a base real para enviar publicidade.'); return; }
                if (!roundName.trim()) {
                    setCampaignError('Informe o nome da rodada para evitar contatos repetidos.');
                    return;
                }
                preparationRef.current = true;
                setBusy(true);
                setCampaignError('');
                setDirectProgress(null);
                setPreparationStage('Validando template e contatos…');
                try {
                    let headerMediaId = null;
                    const requiresImage = tpl.components?.some(component => component.type === 'HEADER' && component.format === 'IMAGE');
                    if (requiresImage) {
                        if (!file?.data) throw new Error('Anexe a imagem exigida pelo template antes de salvar a campanha.');
                        setPreparationStage('Enviando imagem para a Meta… (limite de 45 segundos)');
                        const { response: uploadResponse, data: uploadData } = await campaignRequest('/api/media/upload', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mediaData: file.data, mediaType: file.type, fileName: file.name })
                        }, 45000, 'A imagem não foi confirmada em 45 segundos. Nenhuma mensagem foi disparada por esta preparação. Verifique a conexão e as configurações da Meta.');
                        if (!uploadResponse.ok) throw new Error(uploadData.error || 'Não foi possível enviar a imagem para a Meta.');
                        if (!uploadData.mediaId) throw new Error('O servidor não retornou o identificador da imagem. Nenhuma mensagem foi disparada por esta preparação.');
                        headerMediaId = uploadData.mediaId;
                    }

                    const templateText = tpl.components?.find(component => component.type === 'BODY')?.text || tpl.name;
                    const draft = {
                        name: campaignName.trim() || (filterTags.length ? filterTags.join(', ').slice(0, 100) : `Publicidade ${new Date().toLocaleString('pt-BR')}`),
                        roundName: roundName.trim(),
                        tags: excelMode ? [] : (filterTags.length ? filterTags : availableTags),
                        phones: [...new Set(sel)],
                        templateName: tpl.name,
                        languageCode: tpl.language || 'pt_BR',
                        templateText,
                        headerMediaId
                    };
                    setPreparationStage('Salvando campanha e verificando repetidos… (limite de 45 segundos)');
                    const { response, data } = await campaignRequest('/api/remarketing/campaigns', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(draft)
                    }, 45000, 'A gravação não foi confirmada em 45 segundos. Nenhuma mensagem foi disparada por esta preparação, mas a lista pode ter sido salva. Consulte Campanhas salvas antes de tentar novamente; não troque a rodada para contornar repetidos.');
                    if ([404, 405].includes(response.status)) {
                        setHistoryUnavailable(true);
                        if (sendNow) {
                            setSendConfirmation({ ...draft, direct: true, pendingCount: draft.phones.length });
                        } else {
                            setCampaignError('O histórico de campanhas não está disponível neste servidor. Use Enviar publicidade para revisar e confirmar um envio direto, sem salvar a rodada.');
                        }
                        return;
                    }
                    if (!response.ok) throw new Error(data.error || 'Não foi possível salvar a campanha. Tente novamente ou verifique a conexão com o servidor.');
                    if (!data._id || !Number.isFinite(Number(data.pendingCount))) {
                        throw new Error('O servidor não retornou uma campanha válida. Nenhuma mensagem foi enviada. Consulte o histórico antes de tentar novamente.');
                    }
                    setActiveCampaign(data);
                    setCampaigns(current => [data, ...current.filter(item => String(item._id) !== String(data._id))].slice(0, 100));
                    setSel([]);
                    setCampaignHistoryOpen(false);
                    setFile(null);
                    if (sendNow) {
                        setPreparationStage('');
                        await sendCampaign(data, true, true);
                    }
                    else alert(`Lista salva sem enviar mensagens.\n\n${data.totalRecipients} números únicos foram reservados para "${data.roundName}".${data.skippedCount ? `\n${data.skippedCount} contatos foram pulados porque já estavam nessa rodada ou não estão mais na base.` : ''}\n\nEstimativa máxima: R$ ${Number(data.estimatedTotalCost || 0).toFixed(2).replace('.', ',')}.`);
                } catch (error) {
                    setCampaignError(error.message || 'Não foi possível criar a campanha.');
                } finally {
                    preparationRef.current = false;
                    setPreparationStage('');
                    setBusy(false);
                }
            };

            const sendCampaign = async (campaign = activeCampaign, prepared = false, confirmed = false) => {
                if (CRM_PREVIEW || !campaign || (busy && !prepared) || directSendRef.current) return;
                const pending = Number(campaign.pendingCount || 0);
                if (pending === 0) {
                    setCampaignError('Esta campanha não tem contatos pendentes. Verifique as falhas ou escolha outra campanha.');
                    return;
                }
                if (!confirmed) {
                    setSendConfirmation(campaign);
                    return;
                }
                directSendRef.current = true;
                setSendConfirmation(null);
                setCampaignError('');
                setBusy(true);
                stopCampaignRef.current = false;
                const attempted = new Set();
                const results = [];
                const runId = `campaign-${Date.now()}`;
                let processed = 0, sent = 0, failed = 0, uncertain = 0;
                let currentPhone = null;
                const update = (running) => {
                    setProg({ c: processed, t: pending, erros: failed, incertos: uncertain });
                    setDirectProgress({ runId, campaignId: campaign._id, name: campaign.name, mode: 'campaign', total: pending, sent, failed, uncertain, pending: Math.max(0, pending - processed), running, currentPhone: running ? currentPhone : null, results: [...results] });
                };
                update(true);
                try {
                    while (!stopCampaignRef.current && processed < pending) {
                        const { response: pendingResponse, data: pendingData } = await campaignRequest(
                            `/api/remarketing/campaigns/${encodeURIComponent(campaign._id)}/recipients?status=pending&limit=500`,
                            { cache: 'no-store' }, 30000,
                            'A consulta dos contatos pendentes excedeu 30 segundos. Nenhum novo envio foi iniciado nesta consulta. Atualize Campanhas salvas antes de retomar.'
                        );
                        if (!pendingResponse.ok) throw new Error(pendingData.error || `Não foi possível carregar os contatos pendentes (HTTP ${pendingResponse.status}).`);
                        if (!Array.isArray(pendingData.recipients)) throw new Error('O servidor retornou uma lista de contatos inválida. O disparo foi pausado sem iniciar novas tentativas.');
                        const recipients = pendingData.recipients.filter(item => !attempted.has(String(item._id)));
                        if (recipients.length === 0) {
                            setCampaignError('Não há novos contatos pendentes nesta consulta. O disparo foi pausado; atualize Campanhas salvas para conferir os contatos já iniciados e os resultados incertos, sem repetir automaticamente.');
                            break;
                        }
                        for (const recipient of recipients) {
                            if (stopCampaignRef.current || processed >= pending) break;
                            attempted.add(String(recipient._id));
                            currentPhone = recipient.phone;
                            update(true);
                            try {
                                const { response, data } = await campaignRequest('/api/messages/send', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        phone: recipient.phone,
                                        templateName: campaign.templateName,
                                        languageCode: campaign.languageCode || 'pt_BR',
                                        messageText: campaign.templateText || campaign.templateName,
                                        mediaId: campaign.headerMediaId || undefined,
                                        campaignRecipientId: recipient._id
                                    })
                                }, 60000, 'O servidor não confirmou este contato em 60 segundos. O resultado é incerto: confira a conversa e o histórico antes de qualquer nova tentativa.');
                                if (response.ok && data.success === true) {
                                    sent++;
                                    results.push({ phone: recipient.phone, wamid: data.wamid || null, status: 'sent', detail: 'Aceito pelo servidor; entrega não confirmada.' });
                                } else if (response.ok || response.status >= 500 || response.status === 0) {
                                    uncertain++;
                                    results.push({ phone: recipient.phone, status: 'uncertain', detail: data.error || 'Resultado não confirmado. Confira a conversa antes de repetir.' });
                                    stopCampaignRef.current = true;
                                    setCampaignError('Envio pausado: confira o contato com resultado incerto antes de tentar novamente.');
                                } else {
                                    failed++;
                                    const detail = data.error || `Recusado pelo servidor (${response.status}).`;
                                    results.push({ phone: recipient.phone, status: 'failed', detail });
                                    setCampaignError(detail);
                                    if ([401, 403, 404, 405, 429].includes(response.status)) stopCampaignRef.current = true;
                                }
                            } catch (error) {
                                uncertain++;
                                const detail = error.message || 'Conexão interrompida. Confira a conversa antes de repetir.';
                                results.push({ phone: recipient.phone, status: 'uncertain', detail });
                                stopCampaignRef.current = true;
                                setCampaignError(detail);
                            }
                            processed++;
                            currentPhone = null;
                            update(true);
                            if (!stopCampaignRef.current && processed < pending) await new Promise(resolve => setTimeout(resolve, 1000));
                        }
                    }
                } catch (error) {
                    setCampaignError(error.message || 'O envio foi interrompido.');
                } finally {
                    update(false);
                    try {
                        const items = await refreshCampaigns();
                        const updated = items.find(item => String(item._id) === String(campaign._id));
                        if (updated) setActiveCampaign(updated);
                    } catch (error) {
                        setCampaignError(error.message || 'Não foi possível atualizar o histórico. A contagem deste disparo permanece abaixo do botão de envio.');
                    }
                    directSendRef.current = false;
                    setBusy(false);
                }
            };

            const retryFailed = async () => {
                if (!activeCampaign || busy || !activeCampaign.failedCount) return;
                if (!window.confirm(`Tentar novamente ${activeCampaign.failedCount} contato(s) que a Meta recusou?\n\nOs contatos com status incerto não serão repetidos. A nova tentativa pode gerar custo de R$ ${(activeCampaign.failedCount * 0.32).toFixed(2).replace('.', ',')}.`)) return;
                try {
                    const response = await fetch(`/api/remarketing/campaigns/${encodeURIComponent(activeCampaign._id)}/retry-failed`, { method: 'POST' });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(data.error || 'Não foi possível liberar as falhas para nova tentativa.');
                    const items = await refreshCampaigns();
                    const updated = items.find(item => String(item._id) === String(activeCampaign._id));
                    if (updated) setActiveCampaign(updated);
                    alert(`${data.retriedCount || 0} contato(s) liberados. Revise o custo estimado antes de retomar o envio.`);
                } catch (error) {
                    setCampaignError(error.message || 'Não foi possível tentar novamente.');
                }
            };

            const getTemplatePreview = (template) => {
                if (!template) return null;
                const bodyComponent = template.components?.find(c => c.type === 'BODY');
                return bodyComponent?.text || 'Sem preview disponível';
            };

            return (
                <div className="p-8 max-w-6xl mx-auto h-full overflow-y-auto">
                    <h2 className="text-2xl font-black mb-6">
                        <i className="fas fa-rocket mr-2 text-purple-600"></i> 
                        Disparo em Massa
                    </h2>
                    <div className="mb-5 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div>
                                <div className="font-black">Remarketing organizado por rodada</div>
                                <p className="mt-1 text-xs leading-5">
                                    {historyUnavailable
                                        ? 'Este servidor não tem registro de campanhas. O envio direto continua disponível, com confirmação e contagem contato por contato, mas sem histórico de campanha nem bloqueio de repetidos entre rodadas. Não feche esta tela durante o envio. '
                                        : 'Escolha as tags, os contatos e o template e clique em Enviar publicidade. Com o registro de campanhas disponível, o histórico é salvo automaticamente e o mesmo telefone só entra uma vez na mesma rodada. Para um novo contato planejado, use outro nome de rodada. '}
                                    Estimativa informada: <strong>R$ 0,32 por mensagem</strong>.
                                    Envie apenas para contatos que autorizaram receber comunicações e usando templates aprovados pela Meta.
                                </p>
                            </div>
                            <button
                                onClick={() => {
                                    setCampaignHistoryOpen(value => !value);
                                    setCampaignError('');
                                    if (!campaignHistoryOpen) refreshCampaigns().catch(() => {});
                                }}
                                className="shrink-0 rounded-xl border border-amber-300 bg-white px-3 py-2 text-xs font-black text-amber-900 hover:bg-amber-100"
                            >
                                <i className="fas fa-clock-rotate-left mr-1"></i>
                                {campaignHistoryOpen ? 'Fechar histórico' : campaignHistoryLoading ? 'Consultando campanhas…' : `Campanhas salvas (${campaigns.length})`}
                            </button>
                        </div>
                        {campaignHistoryError && <div role="alert" className="mt-3 rounded-lg border border-amber-300 bg-white px-3 py-2 text-xs text-amber-900">
                            <p className="font-bold">Não foi possível atualizar Campanhas salvas</p>
                            <p className="mt-1">{campaignHistoryError}</p>
                            <p className="mt-1">A lista anterior foi mantida. Se persistir, publique o backend atualizado no Railway e confira a conexão e os logs do MongoDB.</p>
                            <button type="button" disabled={campaignHistoryLoading} onClick={() => refreshCampaigns().catch(() => {})} className="mt-2 rounded-lg border border-amber-300 px-3 py-2 font-black disabled:opacity-50">{campaignHistoryLoading ? 'Consultando…' : 'Atualizar campanhas'}</button>
                        </div>}
                        {campaignError && <p role="alert" className="mt-3 rounded-lg border border-red-200 bg-white px-3 py-2 text-xs font-bold text-red-700">{campaignError}</p>}
                    </div>
                    {campaignHistoryOpen && (
                        <div className="mb-5 rounded-2xl border bg-white p-4">
                            <div className="mb-3 flex items-center justify-between">
                                <h3 className="font-black text-slate-800">Histórico de campanhas</h3>
                                <button disabled={campaignHistoryLoading} onClick={() => refreshCampaigns().catch(() => {})} className="text-xs font-bold text-purple-700 hover:underline disabled:opacity-50">{campaignHistoryLoading ? 'Consultando…' : 'Atualizar'}</button>
                            </div>
                            <div className="max-h-72 space-y-2 overflow-y-auto">
                                {campaigns.map(campaign => (
                                    <button
                                        key={campaign._id}
                                        onClick={() => selectCampaign(campaign)}
                                        className={`flex w-full flex-wrap items-center justify-between gap-3 rounded-xl border p-3 text-left hover:border-purple-300 hover:bg-purple-50 ${String(activeCampaign?._id) === String(campaign._id) ? 'border-purple-400 bg-purple-50' : 'border-slate-200 bg-white'}`}
                                    >
                                        <span className="min-w-0">
                                            <span className="block truncate text-sm font-black text-slate-800">{campaign.name}</span>
                                            <span className="mt-0.5 block text-[11px] text-slate-500">{campaign.roundName} · {campaign.templateName}</span>
                                        </span>
                                        <span className="flex flex-wrap gap-2 text-[10px] font-bold">
                                            <span className="rounded-full bg-slate-100 px-2 py-1 text-slate-700">{campaign.totalRecipients || 0} total</span>
                                            <span className="rounded-full bg-emerald-100 px-2 py-1 text-emerald-800">{campaign.sentCount || 0} aceitos</span>
                                            <span className="rounded-full bg-amber-100 px-2 py-1 text-amber-800">{campaign.pendingCount || 0} pendentes</span>
                                            <span className="rounded-full bg-emerald-100 px-2 py-1 text-emerald-800">{campaign.deliveredCount ?? '—'} entregues / lidas</span>
                                            <span className="rounded-full bg-red-100 px-2 py-1 text-red-800">{campaign.deliveryFailedCount ?? '—'} falhas confirmadas</span>
                                            <span className="rounded-full bg-amber-100 px-2 py-1 text-amber-800">{campaign.unconfirmedCount ?? '—'} sem confirmação</span>
                                        </span>
                                    </button>
                                ))}
                                {campaigns.length === 0 && <p role="status" className="rounded-xl bg-slate-50 p-4 text-center text-xs text-slate-500">{campaignHistoryLoading ? 'Consultando campanhas salvas…' : campaignHistoryError ? 'Histórico indisponível. Não é possível afirmar que não há campanhas salvas.' : 'Nenhuma campanha salva ainda.'}</p>}
                            </div>
                        </div>
                    )}
                    {directProgress && (
                        <section aria-label="Andamento do disparo" className="mb-5 rounded-2xl border border-purple-200 bg-white p-4 shadow-sm">
                            <h3 className="font-black text-purple-800">{directProgress.running ? 'Enviando contato por contato' : directProgress.pending ? 'Envio pausado' : 'Envio finalizado'}</h3>
                            <p className="mt-1 break-words text-xs text-slate-500">{directProgress.name} · {directProgress.mode === 'campaign' ? 'Contagem desta execução da campanha' : 'Envio direto, sem histórico de campanha'}</p>
                            <p role="status" aria-live="polite" className="mt-3 text-sm font-bold text-slate-800">
                                {directProgress.total - directProgress.pending} / {directProgress.total} processados · {directProgress.sent} aceitos pelo servidor
                            </p>
                            <progress aria-label="Contatos processados" value={directProgress.total - directProgress.pending} max={directProgress.total || 1} className="mt-2 h-3 w-full" />
                            <p className="mt-2 text-xs text-slate-600">{directProgress.failed} recusas imediatas da API · {directProgress.uncertain} a conferir · {directProgress.pending} não tentados. Esta contagem de tentativas não inclui falhas posteriores; confira o resumo de entregas abaixo.</p>
                            <p className="mt-2 text-xs text-slate-600">Estimativa dos envios aceitos: <strong>R$ {(directProgress.sent * 0.32).toFixed(2).replace('.', ',')}</strong>. Aceito não significa entregue; confira o status nas conversas.</p>
                            {directProgress.running ? (
                                <button type="button" onClick={() => { stopCampaignRef.current = true; }} className="mt-3 rounded-xl bg-slate-700 px-4 py-2 text-xs font-black text-white">Parar após o contato atual</button>
                            ) : <p className="mt-3 text-xs text-slate-500">Confira o resultado de cada telefone abaixo do botão Enviar publicidade antes de iniciar outro envio. {directProgress.mode === 'direct' ? 'As tentativas foram retiradas da seleção; os não tentados continuam selecionados.' : 'Os totais acumulados ficam na campanha; este resumo mostra apenas a execução atual.'}</p>}
                        </section>
                    )}
                    {activeCampaign && (
                        <div className="mb-5 rounded-2xl border border-purple-200 bg-white p-4 shadow-sm">
                            <div className="flex flex-wrap items-start justify-between gap-4">
                                <div className="min-w-0">
                                    <div className="text-[10px] font-black uppercase tracking-wide text-purple-700">Campanha selecionada</div>
                                    <h3 className="mt-1 truncate text-lg font-black text-slate-800">{activeCampaign.name}</h3>
                                    <p className="mt-1 text-xs text-slate-500">Rodada: {activeCampaign.roundName} · Template: {activeCampaign.templateName}</p>
                                </div>
                                <button onClick={() => setActiveCampaign(null)} className="rounded-lg px-2 py-1 text-xs font-bold text-slate-400 hover:bg-slate-100 hover:text-slate-700">Fechar</button>
                            </div>
                            <div className="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-5">
                                {[
                                    ['Total', activeCampaign.totalRecipients || 0, 'bg-slate-100 text-slate-800'],
                                    ['Aceitos', activeCampaign.sentCount || 0, 'bg-emerald-100 text-emerald-800'],
                                    ['Pendentes', activeCampaign.pendingCount || 0, 'bg-amber-100 text-amber-800'],
                                    ['Entregues / lidas', activeCampaign.deliveredCount ?? '—', 'bg-emerald-100 text-emerald-800'],
                                    ['Falhas confirmadas', activeCampaign.deliveryFailedCount ?? '—', 'bg-red-100 text-red-800'],
                                    ['Sem confirmação', activeCampaign.unconfirmedCount ?? '—', 'bg-orange-100 text-orange-800'],
                                    ['Recusas imediatas', activeCampaign.failedCount || 0, 'bg-red-50 text-red-800']
                                ].map(([label, count, color]) => (
                                    <div key={label} className={`rounded-xl px-3 py-2 ${color}`}>
                                        <div className="text-[10px] font-bold">{label}</div>
                                        <div className="mt-0.5 text-lg font-black">{count}</div>
                                    </div>
                                ))}
                            </div>
                            <div className="mt-3 flex flex-wrap items-center justify-between gap-3">
                                <div className="text-xs text-slate-600">
                                    Estimativa total <strong>R$ {Number(activeCampaign.estimatedTotalCost || 0).toFixed(2).replace('.', ',')}</strong>
                                    <span className="mx-1">·</span>
                                    Aceitos pela API <strong>R$ {Number(activeCampaign.estimatedSentCost || 0).toFixed(2).replace('.', ',')}</strong>

            const [tagError, setTagError] = useState('');
            
            const tagColors = config?.tagColors || {};
            
            const saveTag = async (e) => {
                e.preventDefault();
                if (CRM_PREVIEW) { setTagError('Nesta demonstração, teste mover as tags entre Ativas e Já trabalhados. A edição depende do servidor real.'); return; }
                if (!tagName.trim()) return;
                setTagError('');
                
                const normalizedTag = tagName.trim().toLowerCase();
                const newTagColors = { ...tagColors, [normalizedTag]: selectedColor };
                
                try {
                    const response = await fetch('/api/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...config, tagColors: newTagColors })
                    });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(result.error || `Erro ao salvar tag (${response.status}).`);
                    }
                    setTagName('');
                    setEditingTag(null);
                    await onUpd();
                } catch (err) {
                    console.error('Erro salvando tag:', err);
                    setTagError(err.message || 'Não foi possível salvar a tag.');
                }
            };

                if (CRM_PREVIEW) { setTagError('A exclusão está desativada nesta demonstração com dados fictícios.'); return; }

                const newTagColors = { ...tagColors };
                delete newTagColors[tagName];
                try {
                    const response = await fetch('/api/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...config, tagColors: newTagColors })
                    });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(result.error || `Erro ao excluir tag (${response.status}).`);
                    }
                    await onUpd();
                } catch (err) {
                    console.error('Erro excluindo tag:', err);
                    alert(err.message || 'Não foi possível excluir a tag.');

                setSelectedColor(color);
                setEditingTag(name);
