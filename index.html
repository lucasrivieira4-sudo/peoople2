            const [showTagSelector, setShowTagSelector] = useState(false);
            
            const tagColors = config?.tagColors || {};
            const leadTags = (leads || []).flatMap(l => Array.isArray(l.tags) ? l.tags : []);
            const availableTags = [...new Set([...Object.keys(tagColors).reverse(), ...leadTags])];
            const [isSaving, setIsSaving] = useState(false);
            const [saveError, setSaveError] = useState('');

            useEffect(() => { 
                if(!socket) return; 
                socket.on('leadUpdate', onUpd); 
                socket.on('leadDelete', onUpd); 
                return () => { socket.off('leadUpdate'); socket.off('leadDelete'); }; 
            }, [socket, onUpd]);

            const toggleTag = (tag) => {
                setSelectedTags(prev => prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]);
            };

            const save = async (e) => { 
                e.preventDefault(); 
                setIsSaving(true);
                setSaveError('');
                try {
                    const response = await fetch('/api/leads', { 
                        method:'POST', 
                        headers:{'Content-Type':'application/json'}, 
                        body:JSON.stringify({ name:n, phone:p, tags: selectedTags }) 
                    });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(result.error || `Erro ao salvar contato (${response.status}).`);
                    }
                    await onUpd();
                    setN(''); setP(''); setSelectedTags([]); setEdit(null); setShowTagSelector(false);
                } catch (err) {
                    console.error('Erro salvando lead:', err);
                    setSaveError(err.message || 'Não foi possível salvar o contato. Tente novamente.');
                } finally {
                    setIsSaving(false);
                }
            };

            const startEdit = (lead) => {
                setN(lead.name);
                setP(lead.phone);
                setSelectedTags(lead.tags || []);
                setEdit(lead.phone);
            };

            return (
                <div className="p-8 max-w-6xl mx-auto h-full overflow-y-auto">
                    <h2 className="text-2xl font-black mb-6"><i className="fas fa-users mr-2 text-purple-600"></i> Leads</h2>
                    <div className="bg-white p-6 rounded-2xl border mb-6">
                        <form onSubmit={save} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input value={n} onChange={e=>setN(e.target.value)} placeholder="Nome" className="p-3 bg-slate-50 rounded-xl outline-none" required />
                            <input value={p} onChange={e=>setP(e.target.value)} placeholder="Telefone" className="p-3 bg-slate-50 rounded-xl outline-none" required disabled={!!edit} />
                            <div className="relative">
                                <button
                                    type="button"
                                    onClick={() => setShowTagSelector(!showTagSelector)}
                                    className="w-full p-3 bg-slate-50 rounded-xl outline-none text-left flex items-center justify-between"
                                >
                                    <span className={selectedTags.length ? 'text-slate-800' : 'text-slate-400'}>
                                        {selectedTags.length ? `${selectedTags.length} tag(s)` : 'Selecionar tags...'}
                                    </span>
                                    <i className={`fas fa-chevron-${showTagSelector ? 'up' : 'down'} text-slate-400`}></i>
                                </button>
                                {showTagSelector && (
                                    <div className="absolute top-full left-0 right-0 mt-2 bg-white border rounded-xl shadow-lg z-50 max-h-48 overflow-y-auto p-2">
                                        {availableTags.length === 0 ? (
                                            <div className="p-3 text-center text-slate-400 text-sm">Nenhuma tag criada. Vá em "Tags" para criar.</div>
                                        ) : (
                                            availableTags.map(tag => (
                                                <div key={tag} onClick={() => toggleTag(tag)} className="flex items-center gap-3 p-2 hover:bg-slate-50 rounded-lg cursor-pointer">
                                                    <div className={`w-5 h-5 rounded border-2 flex items-center justify-center ${selectedTags.includes(tag) ? 'bg-purple-600 border-purple-600' : 'border-slate-300'}`}>
                                                        {selectedTags.includes(tag) && <i className="fas fa-check text-white text-xs"></i>}
                                                    </div>
                                                    <span className="px-2 py-1 rounded-full text-white text-xs font-bold" style={{ backgroundColor: tagColors[tag] }}>{tag}</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}
                            </div>
                            <div className="md:col-span-3 flex flex-wrap gap-2 min-h-[40px]">
                                {selectedTags.map(tag => (
                                    <span key={tag} className="px-3 py-1 rounded-full text-white text-sm font-bold flex items-center gap-2" style={{ backgroundColor: tagColors[tag] }}>
                                        {tag}
                                        <button type="button" onClick={() => toggleTag(tag)} className="hover:bg-white/20 rounded-full w-5 h-5 flex items-center justify-center">
                                            <i className="fas fa-times text-xs"></i>
                                        </button>
                                    </span>
                                ))}
                            </div>
                            {saveError && (
                                <p role="alert" className="md:col-span-3 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
                                    {saveError}
                                </p>
                            )}
                            <button type="submit" disabled={isSaving} className="md:col-span-3 py-3 bg-purple-700 text-white rounded-xl font-bold hover:bg-purple-800 transition-colors disabled:cursor-not-allowed disabled:opacity-60">
                                {isSaving ? 'SALVANDO...' : edit ? 'ATUALIZAR' : 'SALVAR'}
                            </button>
                            {edit && (
                                <button type="button" onClick={() => { setN(''); setP(''); setSelectedTags([]); setEdit(null); setShowTagSelector(false); }} className="md:col-span-3 py-3 bg-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-300 transition-colors">
                                    CANCELAR
                                </button>
                            )}
                        </form>
                    </div>
                    <div className="bg-white rounded-2xl border overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 border-b text-[10px] text-slate-400 uppercase">
                                <tr><th className="p-4">Nome</th><th className="p-4">Telefone</th><th className="p-4">Tags</th><th className="p-4 text-right">Ações</th></tr>
                            </thead>
                            <tbody>
                                {(leads || []).map(l => (
                                    <tr key={l.phone} className="border-b hover:bg-slate-50">
                                        <td className="p-4 font-bold text-sm">{l.name}</td>
                                        <td className="p-4 text-xs font-mono">{l.phone}</td>
                                        <td className="p-4">
                                            <div className="flex flex-wrap gap-1">
                                                {(l.tags || []).map(tag => (
                                                    <span key={tag} className="tag-badge text-white" style={{ backgroundColor: tagColors[tag] || '#e2e8f0' }}>{tag}</span>
                                                ))}
                                            </div>
                                        </td>
                                        <td className="p-4 text-right flex justify-end gap-2">
                                            <button onClick={() => onChat(l.phone)} className="w-8 h-8 rounded bg-purple-100 text-purple-600 hover:bg-purple-200 transition-colors"><i className="fas fa-comment"></i></button>
                                            <button onClick={() => startEdit(l)} className="w-8 h-8 rounded bg-blue-100 text-blue-600 hover:bg-blue-200 transition-colors"><i className="fas fa-pen"></i></button>
                                            <button onClick={async () => { if(confirm("Excluir?")) await fetch(`/api/leads/${l.phone}`, {method:'DELETE'}); }} className="w-8 h-8 rounded bg-red-100 text-red-600 hover:bg-red-200 transition-colors"><i className="fas fa-trash"></i></button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        });

        const QuickView = memo(({ qr, onUpd }) => {
            const [s, setS] = useState(''); const [t, setT] = useState(''); const [f, setF] = useState(null); const fR = useRef(null);
            const save = async (e) => { 
                e.preventDefault(); 
                try {
                    await fetch('/api/quick-replies', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ shortcut:s, text:t, mediaData:f?.data, mediaName:f?.name, mediaType:f?.type }) }); 
                    setS(''); setT(''); setF(null); onUpd();
                } catch (err) { console.error('Erro:', err); alert('Erro ao salvar'); }
            };
            return (
                <div className="p-8 max-w-6xl mx-auto h-full overflow-y-auto">
                    <h2 className="text-2xl font-black mb-6"><i className="fas fa-bolt mr-2 text-purple-600"></i> Respostas Rápidas</h2>
                    <div className="bg-white p-6 rounded-2xl border mb-6">
                        <form onSubmit={save} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <input value={s} onChange={e=>setS(e.target.value)} placeholder="Atalho" className="w-full p-3 bg-slate-50 rounded-xl mb-4 outline-none" required />
                                <textarea value={t} onChange={e=>setT(e.target.value)} placeholder="Mensagem" className="w-full p-3 bg-slate-50 rounded-xl h-24 resize-none outline-none" required />
                            </div>
                            <div onClick={()=>fR.current.click()} className="border-2 border-dashed border-slate-100 rounded-xl flex flex-col items-center justify-center cursor-pointer">
                                {f ? <img src={f.data} className="w-16 h-16 rounded object-cover" alt="" /> : <i className="fas fa-paperclip text-slate-300 text-2xl"></i>}
                                <div className="text-[10px] mt-2 font-bold">{f?f.name:'Anexar Mídia'}</div>
                                <input type="file" ref={fR} className="hidden" onChange={e=>{const fl=e.target.files[0]; if(fl) processFile(fl).then(setF);}}/>
                            </div>
                            <button type="submit" className="md:col-span-2 py-3 bg-purple-700 text-white rounded-xl font-bold">SALVAR</button>
                        </form>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {(qr || []).map(q=>(
                            <div key={q._id} className="bg-white p-4 rounded-2xl border relative">
                                <button onClick={async ()=>{if(confirm("Excluir?")){await fetch(`/api/quick-replies/${q._id}`, {method:'DELETE'}); onUpd();}}} className="absolute top-3 right-3 text-slate-300 hover:text-red-500"><i className="fas fa-times-circle"></i></button>
                                <div className="font-black text-purple-700 text-xs mb-1">/{q.shortcut}</div>
                                <div className="text-xs text-slate-600 line-clamp-3">{q.text}</div>
                                {q.mediaData && <div className="mt-3 pt-3 border-t flex items-center"><i className="fas fa-paperclip text-purple-400 mr-2 text-xs"></i><span className="text-[9px] text-slate-400 truncate">{q.mediaName}</span></div>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        });

        const ConfigView = memo(({ config, onUpd }) => {
            const [f, setF] = useState(config || {}); 
            useEffect(() => { setF(config || {}); }, [config]);
            const save = async (e) => { 
                e.preventDefault(); 
                try {
                    await fetch('/api/config', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(f) }); 
                    onUpd(); 
                    alert("Salvo!");
                } catch (err) { console.error('Erro:', err); alert('Erro ao salvar'); }
            };
            return (
                <div className="p-8 max-w-3xl mx-auto h-full overflow-y-auto">
                    <h2 className="text-2xl font-black mb-6"><i className="fas fa-cog mr-2 text-purple-600"></i> Configurações</h2>
                    <form onSubmit={save} className="space-y-4">
                        <div className="bg-white p-6 rounded-2xl border grid grid-cols-1 gap-4">
                            <div className="rounded-xl bg-slate-50 p-4">
                                <div className="font-bold text-slate-800">Conexão WhatsApp (Meta)</div>
                                <p className="mt-2 text-sm text-slate-600">
                                    As credenciais são carregadas pelo servidor a partir das variáveis do Railway.
                                    Não insira tokens nesta tela.
                                </p>
                                <p className={`mt-3 text-sm font-bold ${config?.metaConfigured ? 'text-green-700' : 'text-amber-700'}`}>
                                    {config?.metaConfigured
                                        ? 'Variáveis Meta detectadas no servidor.'
                                        : 'Configuração Meta incompleta: confira as variáveis no Railway.'}
                                </p>
                                <p className="mt-2 text-xs text-slate-500">
                                    Configure META_ACCESS_TOKEN, META_PHONE_NUMBER_ID,
                                    META_BUSINESS_ACCOUNT_ID e META_WEBHOOK_VERIFY_TOKEN no serviço do Railway.
                                </p>
                            </div>
                        </div>
                        <button type="submit" className="w-full py-4 bg-purple-700 text-white rounded-2xl font-black hover:bg-purple-800">SALVAR TUDO</button>
                    </form>
                </div>
            );
        });

        // ============================================
        // APP PRINCIPAL
        // ============================================
        function App() {
            const [tab, setTab] = useState(CRM_PREVIEW ? 'tags' : 'chat'); 
            const [convs, setConvs] = useState([]); 
            const [sel, setSel] = useState(null); 
            const [leads, setLeads] = useState([]); 
            const [tpls, setTpls] = useState([]); 
            const [qr, setQr] = useState([]); 
            const [cfg, setCfg] = useState({}); 
            const [socket, setSocket] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);
            const [unreadCounts, setUnreadCounts] = useState({});
            const selRef = useRef(null);
            const notifAudio = useRef(null);
            const [advertisingTag, setAdvertisingTag] = useState(null);
            const [deliveryRows, setDeliveryRows] = useState([]);
            const [deliveryLoading, setDeliveryLoading] = useState(false);
            const [deliveryError, setDeliveryError] = useState('');
            const [deliveryUpdatedAt, setDeliveryUpdatedAt] = useState('');
            const deliveryRequest = useRef(false);
            const refreshDeliveryQueues = useCallback(async () => {
                if (CRM_PREVIEW || deliveryRequest.current) return;
                deliveryRequest.current = true;
                setDeliveryLoading(true);
                try {
                    const { data } = await requestDeliveryQueues();
                    setDeliveryRows(data.rows);
                    setDeliveryError('');
                    setDeliveryUpdatedAt(new Date(data.syncedAt || Date.now()).toLocaleTimeString('pt-BR'));
                    return true;
                } catch (err) {
                    setDeliveryError(err.message || 'Não foi possível atualizar as filas.');
                    return false;
                } finally {
                    deliveryRequest.current = false;
                    setDeliveryLoading(false);
                }
            }, []);
            useEffect(() => {
                let stopped = false;
                let timer;
                const poll = async () => {
                    const synced = await refreshDeliveryQueues();
                    if (!stopped) timer = setTimeout(poll, synced === false ? 60000 : 15000);
                };
                poll();
                return () => { stopped = true; clearTimeout(timer); };
            }, [refreshDeliveryQueues]);
            const failedDeliveryPhones = useMemo(() => new Set(deliveryRows.filter(row => row.queue === 'failed').map(row => row.phone)), [deliveryRows]);
            const triageConversations = useMemo(() => convs.filter(row => !failedDeliveryPhones.has(row.phone)), [convs, failedDeliveryPhones]);

            useEffect(() => {
                notifAudio.current = new Audio(NOTIFICATION_SOUND);
                notifAudio.current.volume = 0.5;
            }, []);

            // Pede permissão para mostrar notificações do navegador (funciona minimizado/em outra aba)
            useEffect(() => {
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission().catch(() => {});
                }
            }, []);

            // Mantém selRef sempre atualizado com o telefone selecionado
            useEffect(() => { selRef.current = sel; }, [sel]);

            // Atualiza o título da aba com total de não lidas
            const totalUnread = useMemo(() => Object.values(unreadCounts).reduce((a, b) => a + b, 0), [unreadCounts]);
            useEffect(() => {
                document.title = totalUnread > 0
                    ? `(${totalUnread}) PeOople Hub`
                    : 'PeOople Hub - Painel Administrativo';
            }, [totalUnread]);

            // Ao focar na janela, zera não lidas da conversa ativa
            useEffect(() => {
                const onFocus = () => {
                    if (selRef.current) {
                        setUnreadCounts(prev => { const n = { ...prev }; delete n[selRef.current]; return n; });
                    }
                };
                window.addEventListener('focus', onFocus);
                return () => window.removeEventListener('focus', onFocus);
            }, []);

            // Ao selecionar conversa, zera as não lidas dela
            const handleSelectPhone = useCallback((phone) => {
                setSel(phone);
                setTab('chat');
                setUnreadCounts(prev => { const n = { ...prev }; delete n[phone]; return n; });
            }, []);

            useEffect(() => {
                let isMounted = true;
                let clientSocket = null;
                
                const initSocket = () => {
                    try {
                        // Em prévias estáticas sem Socket.IO, os endpoints REST continuam disponíveis.
                        if (CRM_PREVIEW || typeof io !== 'function') return;
                        const s = io(CRM_SERVER, {
                            reconnectionAttempts: Infinity,
                            reconnectionDelay: 1000,
                            reconnectionDelayMax: 5000,
                            timeout: 10000,
                            transports: ['websocket', 'polling']
                        });
                        clientSocket = s;
                        if (!isMounted) {
                            s.close();
                            return;
                        }
                        setSocket(s);
                        s.on('connect', () => console.log('Socket:', s.id));
                        s.on('connect_error', (err) => console.error('Socket erro:', err));
                        s.on('conversationUpdate', (u) => { 
                            setConvs(prev => { 
                                const ex = prev.find(c => c.phone === u.phone); 
                                if (ex) return [{ ...ex, ...u }, ...prev.filter(c => c.phone !== u.phone)]; 
                                return [u, ...prev]; 
                            });
                            // Nova msg recebida — de contato novo OU de conversa antiga já existente
                            if (u.direction === 'received') {
                                const isOtherConv = u.phone !== selRef.current;
                                const isUnfocused = document.hidden || !document.hasFocus();

                                if (isOtherConv) {
                                    setUnreadCounts(prev => ({ ...prev, [u.phone]: (prev[u.phone] || 0) + 1 }));
                                }

                                // Toca som e mostra notificação sempre que não estiver olhando ativamente para essa conversa
                                if (isOtherConv || isUnfocused) {
                                    if (notifAudio.current) {
                                        notifAudio.current.play().catch(() => {});
                                    }
                                    if ('Notification' in window && Notification.permission === 'granted') {
                                        try {
                                            const notif = new Notification(u.name || u.phone, {
                                                body: u.lastMessage || 'Nova mensagem recebida',
                                                tag: 'whatsapp-' + u.phone
                                            });
                                            notif.onclick = () => {
                                                window.focus();
                                                handleSelectPhone(u.phone);
                                                notif.close();
                                            };
                                        } catch (err) {
                                            console.error('Erro notificação:', err);
                                        }
                                    }
                                }
                            }
                        });
                    } catch (err) {
                        console.error('Erro socket:', err);
                    }
                };
                
                initSocket();
                return () => {
                    isMounted = false;
                    if (clientSocket) clientSocket.close();
                };
            }, []);

            const fetchAll = useCallback(async () => {
                if (CRM_PREVIEW) {
                    // Dados fictícios apenas na prévia; nunca representam a base real.
                    setCfg({ tagColors: { 'clientes abril': '#6b21a8', 'interessados maio': '#2563eb', 'rodada anterior': '#059669' }, workedTags: ['rodada anterior'] });
                    setLeads([
                        { phone: 'exemplo-1', name: 'Contato de exemplo 1', tags: ['clientes abril'] },
                        { phone: 'exemplo-2', name: 'Contato de exemplo 2', tags: ['clientes abril', 'interessados maio'] },
                        { phone: 'exemplo-3', name: 'Contato de exemplo 3', tags: ['rodada anterior'] }
                    ]);
                    setIsLoading(false);
                    return;
                }
                try {
                    setIsLoading(true);
                    setError(null);
                    const load = async (path) => {
                        const response = await fetch(path, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
                        if (!response.ok) throw new Error(`O servidor retornou um erro (${response.status}).`);
                        if (!response.headers.get('content-type')?.includes('application/json')) {
                            throw new Error('O servidor não retornou os dados esperados.');
                        }
                        return response.json();
                    };
                    const [c, l, t, q, cfgData] = await Promise.all([
                        load('/api/conversations'),
                        load('/api/leads'),
                        load('/api/meta/templates'),
                        load('/api/quick-replies'),
                        load('/api/config')
                    ]);
                    if (![c, l, t, q].every(Array.isArray) || !cfgData || typeof cfgData !== 'object' || Array.isArray(cfgData)) {
                        throw new Error('O servidor retornou dados em um formato inesperado.');
                    }
                    setConvs(c); setLeads(l); setTpls(t); setQr(q); setCfg(cfgData);
                } catch (e) {
                    console.error('Erro fetchAll:', e);
                    setError('Não foi possível carregar os dados reais do CRM. Confira sua conexão e a disponibilidade e permissão de acesso do servidor no Railway.');
                } finally {
                    setIsLoading(false);
                }
            }, []);

            // Refetch só de leads — sem recarregar tudo
            const fetchLeads = useCallback(async () => {
                try {
                    const l = await fetch('/api/leads').then(r => r.ok ? r.json() : []);
                    setLeads(l || []);
                } catch (e) {
                    console.error('Erro fetchLeads:', e);
                }
            }, []);

            // Refetch só de config
            const fetchConfig = useCallback(async () => {
                if (CRM_PREVIEW) return;
                try {
                    const cfgData = await fetch('/api/config').then(r => r.ok ? r.json() : {});
                    setCfg(cfgData || {});
                } catch (e) {
                    console.error('Erro fetchConfig:', e);
                }
            }, []);

            const moveTag = useCallback(async (tag, worked) => {
                if (CRM_PREVIEW) {
                    setCfg(current => ({ ...current, workedTags: worked
                        ? [...new Set([...(current.workedTags || []), tag])]
                        : (current.workedTags || []).filter(name => name !== tag) }));
                    return;
                }
                const response = await fetch('/api/tags/worked', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tag, worked })
                });
                const data = await response.json().catch(() => ({}));
                if (response.status === 404) {
                    throw new Error('O servidor do CRM ainda precisa ser atualizado no Railway para permitir mover tags. Nada foi confirmado.');
                }
                if (!response.ok) throw new Error(data.error || 'Não foi possível mover a tag.');
                if (!Array.isArray(data.workedTags) || data.workedTags.some(name => typeof name !== 'string')
                    || data.workedTags.includes(tag) !== worked) {
                    throw new Error('O servidor não confirmou a mudança. Recarregue o CRM para conferir as tags antes de tentar novamente.');
                }
                setCfg(current => ({ ...current, workedTags: data.workedTags }));
            }, []);

            useEffect(() => {
                if (!socket) return;
                socket.on('tagsUpdated', fetchConfig);
                return () => socket.off('tagsUpdated', fetchConfig);
            }, [socket, fetchConfig]);

            useEffect(() => { fetchAll(); }, [fetchAll]);

            return (
                <ErrorBoundary>
                    <div className="flex h-screen bg-slate-100">
                        <nav aria-label="Menu do CRM" className="nav-sidebar w-48 shrink-0 bg-purple-900 flex flex-col items-center px-3 py-6 gap-3 z-50">
                            <div className="nav-logo w-full px-3 mb-6 text-white">
                                <div className="text-xl font-black tracking-tight">PeOople <span className="text-purple-300">Hub</span></div>
                                <div className="mt-1 text-[10px] font-bold uppercase tracking-widest text-purple-300">Relacionamento</div>
                            </div>
                            {[
                                ['chat', 'Conversas', 'fa-comment-dots'],
                                ['bulk', 'Disparos', 'fa-rocket'],
                                ['deliveries', 'Entregas e falhas', 'fa-exclamation-circle'],
                                ['leads', 'Contatos', 'fa-users'],
                                ['tags', 'Tags', 'fa-tags'],
                                ['quick', 'Respostas rápidas', 'fa-bolt'],
                                ['config', 'Configurações', 'fa-cog']
                            ].map(([key, label, icon]) => (
                                <button key={key} type="button" onClick={() => { if (key === 'bulk') setAdvertisingTag(null); setTab(key); }} title={label} aria-label={label}
                                    aria-current={tab === key ? 'page' : undefined}
                                    className={`${key === 'config' ? 'nav-config-btn mt-auto' : ''} w-10 md:w-full h-11 shrink-0 rounded-xl flex items-center justify-center md:justify-start gap-3 md:px-3 text-xs font-bold transition-all ${tab === key ? 'active-tab-btn' : 'text-purple-300 hover:bg-white/10'}`}>
                                    <i aria-hidden="true" className={`fas ${icon} w-4 text-center`}></i>
                                    <span className="hidden md:inline">{label}</span>
                                </button>
                            ))}
                        </nav>
                        <div className="main-content-wrap min-w-0 flex-1 overflow-hidden">
                            {isLoading ? (
                                <div role="status" className="flex h-full items-center justify-center bg-slate-50 p-6 text-sm font-bold text-purple-800">
                                    Carregando seus dados do CRM…
                                </div>
                            ) : error ? (
                                <div className="flex h-full items-center justify-center p-6">
                                    <div role="alert" className="max-w-lg rounded-2xl border border-slate-200 bg-white p-6 text-center">
                                        <h1 className="mb-2 text-xl font-black text-purple-800">Conexão com o CRM</h1>
                                        <p className="mb-4 text-sm text-slate-600">{error}</p>
                                        <button type="button" onClick={fetchAll} className="rounded-xl bg-purple-700 px-4 py-3 text-sm font-bold text-white hover:bg-purple-800">Tentar novamente</button>
                                    </div>
                                </div>
                            ) : <>
                            {tab === 'chat' && <div className="flex h-full flex-col">
                                <button type="button" onClick={() => setTab('deliveries')} className="shrink-0 border-b border-purple-100 bg-purple-50 px-4 py-2 text-left text-xs font-bold text-purple-800">
                                    Triagem · {failedDeliveryPhones.size} contato(s) com falha separados em Entregas e falhas. {deliveryError ? 'Consulta indisponível — conferir filas.' : 'Somente falhas confirmadas são retiradas desta lista.'}
                                </button>
                                <div className="min-h-0 flex-1"><ChatView conversations={triageConversations} selectedPhone={sel} setSelectedPhone={handleSelectPhone} config={cfg} templates={tpls} quickReplies={qr} socket={socket} setConversations={setConvs} unreadCounts={unreadCounts} leads={leads} /></div>
                            </div>}
                            {tab === 'deliveries' && <DeliveryQueues rows={deliveryRows} loading={deliveryLoading} error={deliveryError} updatedAt={deliveryUpdatedAt} onRefresh={refreshDeliveryQueues} onChat={handleSelectPhone} />}
                            {tab === 'bulk' && <BulkView leads={leads} templates={tpls} config={cfg} onLeadsUpdate={fetchLeads} onMoveTag={moveTag} initialTag={advertisingTag} />}
                            {tab === 'leads' && <LeadsView leads={leads} config={cfg} onUpd={fetchLeads} socket={socket} onChat={(p) => {
                                // Injeta uma conversa sintética se o lead ainda não tem histórico
                                setConvs(prev => {
                                    if (prev.find(c => c.phone === p)) return prev;
                                    const lead = leads.find(l => l.phone === p);
                                    return [{ phone: p, name: lead?.name || p, lastMessage: '', timestamp: new Date(), tags: lead?.tags || [] }, ...prev];
                                });
                                handleSelectPhone(p);
                            }} />}
                            {tab === 'tags' && <TagsView config={cfg} onUpd={fetchConfig} leads={leads} onMoveTag={moveTag}
                                onAdvertise={tag => { setAdvertisingTag(tag); setTab('bulk'); }} />}
                            {tab === 'quick' && <QuickView qr={qr} onUpd={fetchAll} />}
                            {tab === 'config' && <ConfigView config={cfg} onUpd={fetchConfig} />}
                            </>}
                        </div>
                    </div>
                </ErrorBoundary>
            );
        }

        try {
            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } catch (err) {
            console.error('Erro fatal:', err);
            document.getElementById('root').innerHTML = '<div style="padding:20px;text-align:center"><h2>Erro ao iniciar</h2><p>' + err.message + '</p><button onclick="location.reload()">Recarregar</button></div>';
        }
    </script>
    <script>
        // Registra o service worker somente em contexto seguro (HTTPS ou localhost).
        if ('serviceWorker' in navigator && CRM_SERVER === window.location.origin) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((error) => {
                    console.warn('PWA: não foi possível registrar o service worker', error);
                });
            });
        }
    </script>
</body>
</html>
